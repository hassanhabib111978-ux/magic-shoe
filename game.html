<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>الحذاء السحري — الفصل الأول</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a12;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}body{position:fixed;inset:0}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#1b4654,#040812 72%);text-align:center}.loader{font-weight:900}.loader .mark{font-size:70px;filter:drop-shadow(0 0 28px #d28cff);animation:f 1.6s ease-in-out infinite}@keyframes f{50%{transform:translateY(-12px) rotate(-5deg)}}
#err{max-width:330px;line-height:1.8}.btn{border:0;border-radius:18px;padding:14px 28px;background:linear-gradient(135deg,#e1a5ff,#7048c5);color:white;font-weight:900}
.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;direction:ltr}.pill,.quest,.hint{background:#061321bb;border:1px solid #ffffff1b;backdrop-filter:blur(14px);box-shadow:0 8px 28px #0005}.pill{padding:9px 12px;border-radius:15px;font-weight:900}.stats{display:flex;gap:7px}.quest{position:absolute;right:12px;top:58px;width:min(350px,calc(100vw - 24px));padding:11px 14px;border-radius:17px;text-align:right}.quest b{display:block;color:#f5d796;font-size:11px;margin-bottom:3px}.quest span{font-size:13px;font-weight:850}.stick{position:absolute;left:20px;bottom:20px;width:124px;height:124px;border-radius:50%;background:#0613218f;border:1px solid #ffffff20;pointer-events:auto}.stick:before{content:'';position:absolute;inset:15px;border:1px dashed #ffffff15;border-radius:50%}.stick:after{content:'';position:absolute;width:54px;height:54px;left:34px;top:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#a8cbd7 45%,#657c8b);transform:translate(var(--x,0),var(--y,0));opacity:var(--a,0);box-shadow:0 8px 24px #0008}.action{position:absolute;right:20px;bottom:22px;width:82px;height:82px;border-radius:50%;border:1px solid #ffffff38;background:radial-gradient(circle at 35% 25%,#f0caff,#8a54dc 55%,#42206d);color:white;font-weight:900;pointer-events:auto;box-shadow:0 0 34px #b76dff55}.action:active{transform:scale(.94)}
.title{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#164653ed,#030812f7 70%);pointer-events:auto;transition:opacity .6s}.title.hide{opacity:0;pointer-events:none}.card{text-align:center;padding:24px}.logo{font-size:86px;filter:drop-shadow(0 0 30px #d28cff)}h1{margin:0;font-size:clamp(38px,9vw,64px);font-weight:1000}h2{margin:2px 0 22px;font-size:14px;color:#d8e5ea}.tip{margin-top:14px;color:#9fb7c4;font-size:11px}.start{font-size:16px;min-width:190px}.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);padding:15px 21px;border-radius:20px;background:#071522ee;border:1px solid #ffffff20;box-shadow:0 20px 70px #0009;text-align:center;font-weight:950;opacity:0;transition:.3s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style></head><body>
<div id="loading"><div class="loader"><div class="mark">👞</div><div>جاري تجهيز عالم الحذاء السحري</div><small style="color:#8ea7b5">بدون ملفات خارجية — تجهيز العالم ثلاثي الأبعاد</small></div></div>
<canvas id="game"></canvas>
<div class="ui"><div class="top"><div class="pill">👞 الحذاء السحري</div><div class="stats"><div class="pill">★ <span id="stars">0</span></div><div class="pill">◈ <span id="coins">0</span></div></div></div><div class="quest"><b>المهمة الحالية</b><span id="quest">استكشف الغابة وابحث عن الرمز السحري</span></div><div class="stick" id="stick"></div><button class="action" id="action">تفاعل</button><div class="toast" id="toast"></div><div class="title" id="title"><div class="card"><div class="logo">👞</div><h1>الحذاء السحري</h1><h2>مغامرة ثلاثية الأبعاد — الفصل الأول</h2><button class="btn start" id="start">ابدأ المغامرة</button><div class="tip">استكشف • اكتشف • افتح قدرات جديدة</div></div></div></div>
<script type="module">
const $=id=>document.getElementById(id), loading=$('loading');
try{
 const THREE=await import('./vendor/three.module.js');
 const canvas=$('game');
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;renderer.shadowMap.enabled=true;
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x07151d);scene.fog=new THREE.FogExp2(0x0b2930,.013);
 const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,300);camera.position.set(0,6,11);
 scene.add(new THREE.HemisphereLight(0xb5edff,0x172719,2));const sun=new THREE.DirectionalLight(0xffdfb0,3.5);sun.position.set(-30,40,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);scene.add(new THREE.DirectionalLight(0x779cff,.55).position.set(30,18,-30));
 const world=new THREE.Group();scene.add(world);
 const mat=(c,r=.7,m=0,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,emissive:e,emissiveIntensity:e?1.5:0});
 const ground=new THREE.Mesh(new THREE.CircleGeometry(110,128),mat(0x153d35,1));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;world.add(ground);
 const road=new THREE.Mesh(new THREE.PlaneGeometry(7,160),mat(0x59615b,1));road.rotation.x=-Math.PI/2;road.position.y=.015;world.add(road);
 function tree(x,z,s){const g=new THREE.Group();g.position.set(x,0,z);const t=new THREE.Mesh(new THREE.CylinderGeometry(.2*s,.48*s,3.2*s,9),mat(0x493025,.95));t.position.y=1.6*s;t.castShadow=true;g.add(t);for(let i=0;i<4;i++){const c=new THREE.Mesh(new THREE.ConeGeometry((2.2-i*.18)*s,2.8*s,12),mat([0x185b48,0x207052,0x2b8560,0x3b9869][i],.92));c.position.y=(3+i*1.05)*s;c.castShadow=true;g.add(c)}world.add(g)}
 for(let i=0;i<58;i++){const a=Math.random()*Math.PI*2,r=12+Math.random()*52;tree(Math.cos(a)*r,Math.sin(a)*r,.65+Math.random()*.9)}
 function rock(x,z,s){const q=new THREE.Mesh(new THREE.DodecahedronGeometry(1,1),mat(0x53676a,.9));q.position.set(x,.35*s,z);q.scale.set(1.2*s,.65*s,.9*s);q.rotation.y=Math.random()*6;q.castShadow=true;q.receiveShadow=true;world.add(q)}for(let i=0;i<45;i++){const a=Math.random()*6.28,r=9+Math.random()*55;rock(Math.cos(a)*r,Math.sin(a)*r,.35+Math.random()*1.1)}
 // Ancient shrine
 const shrine=new THREE.Group();shrine.position.set(-11,0,-14);world.add(shrine);for(let i=0;i<5;i++){const p=new THREE.Mesh(new THREE.CylinderGeometry(.7,1,6,12),mat(0x65777b,.78));p.position.set((i-2)*2.1,3.0,.4*(i%2));p.castShadow=true;shrine.add(p)}const slab=new THREE.Mesh(new THREE.BoxGeometry(8,1,4),mat(0x687a7d,.78));slab.position.y=.5;shrine.add(slab);
 const sr=new THREE.Mesh(new THREE.TorusGeometry(2,.14,18,64),mat(0x6ff2d5,.3,0,0x35d9b1));sr.position.set(0,3,1);sr.rotation.x=Math.PI/2;shrine.add(sr);const sg=new THREE.Mesh(new THREE.OctahedronGeometry(.48),mat(0xc6fff2,.15,0,0x55ffcf));sg.position.set(0,4,1);shrine.add(sg);const sl=new THREE.PointLight(0x45e5c5,25,14);sl.position.set(0,4,1);shrine.add(sl);
 // THE MAGIC SHOE: pointed, curled Arabian-fantasy toe
 const shoe=new THREE.Group();shoe.position.set(7,2.3,-8);world.add(shoe);
 const purple=mat(0x55227d,.3,.2,0x17051f), leather=mat(0x9d4fca,.32,.08,0x300b3f), gold=mat(0xf1c86b,.2,.72,0x6a3b08), gem=mat(0x8fffea,.12,.1,0x21e6c0);
 const sole=new THREE.Mesh(new THREE.CapsuleGeometry(1.25,.85,12,28),purple);sole.rotation.z=Math.PI/2;sole.scale.z=.57;sole.castShadow=true;shoe.add(sole);
 const upper=new THREE.Mesh(new THREE.SphereGeometry(1.18,32,22),leather);upper.scale.set(1.15,.58,.75);upper.position.y=.55;upper.castShadow=true;shoe.add(upper);
 const vamp=new THREE.Mesh(new THREE.SphereGeometry(.72,28,18),leather);vamp.scale.set(1.35,.56,.8);vamp.position.set(.9,.48,.03);vamp.castShadow=true;shoe.add(vamp);
 // long pointed toe, visibly curling upward
 const toeCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(.65,.43,0),new THREE.Vector3(1.65,.36,0),new THREE.Vector3(2.55,.45,0),new THREE.Vector3(3.25,.95,0),new THREE.Vector3(3.45,1.55,0)]);
 const toe=new THREE.Mesh(new THREE.TubeGeometry(toeCurve,32,.38,14,false),leather);toe.castShadow=true;shoe.add(toe);
 const toeTip=new THREE.Mesh(new THREE.SphereGeometry(.42,20,14),leather);toeTip.position.set(3.42,1.56,0);toeTip.scale.set(.8,1.15,.8);shoe.add(toeTip);
 // golden decorative ridge follows the magical toe
 const ridge=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(.7,.78,.0),new THREE.Vector3(1.7,.72,.0),new THREE.Vector3(2.5,.86,.0),new THREE.Vector3(3.22,1.28,.0),new THREE.Vector3(3.42,1.72,.0)]),32,.065,8,false),gold);shoe.add(ridge);
 const heel=new THREE.Mesh(new THREE.CylinderGeometry(.38,.52,.85,12),purple);heel.position.set(-1.15,.42,0);heel.castShadow=true;shoe.add(heel);
 const strap=new THREE.Mesh(new THREE.TorusGeometry(.63,.075,10,32),gold);strap.scale.set(1,.65,.75);strap.rotation.x=Math.PI/2;strap.position.set(.05,.82,0);shoe.add(strap);
 const crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.42),gem);crystal.position.set(.05,1.02,.02);crystal.castShadow=true;shoe.add(crystal);const glow=new THREE.PointLight(0x5fffe1,18,9);glow.position.copy(crystal.position);shoe.add(glow);
 // magical side fins
 for(const side of [-1,1]){const fin=new THREE.Mesh(new THREE.ConeGeometry(.42,1.05,5),gold);fin.position.set(-.35,1.05,side*.62);fin.rotation.set(0,side*.9,side*.45);shoe.add(fin)}
 // floating rune rings and spark particles
 const ring1=new THREE.Mesh(new THREE.TorusGeometry(2.2,.045,8,64),gem);ring1.rotation.x=Math.PI/2;shoe.add(ring1);const ring2=new THREE.Mesh(new THREE.TorusGeometry(2.65,.025,8,64),gold);ring2.rotation.x=Math.PI/2;shoe.add(ring2);
 const sparks=[];for(let i=0;i<26;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.035+Math.random()*.045,7,7),i%3?gem:gold);p.userData={a:Math.random()*6.28,r:2+Math.random()*1.2,h:.2+Math.random()*1.8};shoe.add(p);sparks.push(p)}
 // player
 const player=new THREE.Group();player.position.set(0,0,8);world.add(player);const skin=mat(0xd59a72,.8),cloth=mat(0x3c5b91,.65),dark=mat(0x202538,.7);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.9,8,16),cloth);body.position.y=1.15;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.42,18,14),skin);head.position.y=2.15;head.castShadow=true;player.add(head);const turban=new THREE.Mesh(new THREE.TorusGeometry(.43,.13,10,20),gold);turban.position.y=2.38;turban.rotation.x=Math.PI/2;player.add(turban);for(const s of [-1,1]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.62,6,10),skin);arm.position.set(s*.57,1.25,0);arm.rotation.z=s*.25;arm.castShadow=true;player.add(arm);const boot=new THREE.Mesh(new THREE.BoxGeometry(.28,.45,.58),dark);boot.position.set(s*.25,.38,.05);boot.castShadow=true;player.add(boot)}
 const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
 let joy={x:0,y:0},drag=false;const stick=$('stick');function setJoy(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=(e.clientX-cx)/48,y=(e.clientY-cy)/48;const l=Math.hypot(x,y)||1;if(l>1){x/=l;y/=l}joy={x,y};stick.style.setProperty('--x',(x*32)+'px');stick.style.setProperty('--y',(y*32)+'px');stick.style.setProperty('--a',1)}stick.onpointerdown=e=>{drag=true;stick.setPointerCapture(e.pointerId);setJoy(e)};stick.onpointermove=e=>{if(drag)setJoy(e)};stick.onpointerup=stick.onpointercancel=()=>{drag=false;joy={x:0,y:0};stick.style.setProperty('--x','0px');stick.style.setProperty('--y','0px');stick.style.setProperty('--a',0)};
 let running=false,stars=0,coins=0;function toast(t){const q=$('toast');q.textContent=t;q.classList.add('show');setTimeout(()=>q.classList.remove('show'),1700)}
 $('start').onclick=()=>{$('title').classList.add('hide');running=true;toast('ابدأ البحث عن الرمز السحري ✨')};$('action').onclick=()=>{const d=player.position.distanceTo(shoe.position);if(d<6){stars++;coins+=5;$('stars').textContent=stars;$('coins').textContent=coins;$('quest').textContent='وجدت الحذاء السحري! اقترب منه مرة أخرى لاكتشاف قوته';toast('✨ الحذاء اختارك! ✨')}else toast('اقترب أكثر من الحذاء السحري')};
 loading.style.display='none';
 let prev=performance.now(),walk=0;function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-prev)/1000,.033);prev=now;const ix=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0)+joy.x,iz=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0)+joy.y;const len=Math.hypot(ix,iz);if(running&&len>.05){const speed=5.2;player.position.x+=ix/len*speed*dt;player.position.z+=iz/len*speed*dt;player.rotation.y=Math.atan2(ix,iz);walk+=dt*10}const bob=Math.sin(now*.0025)*.12;shoe.position.y=2.3+bob;shoe.rotation.y=Math.sin(now*.0007)*.3;shoe.rotation.z=Math.sin(now*.0017)*.035;ring1.rotation.z=now*.0008;ring2.rotation.z=-now*.00055;crystal.rotation.y=now*.0018;glow.intensity=15+Math.sin(now*.004)*6;for(const p of sparks){p.userData.a+=dt*(.7+p.userData.r*.2);p.position.set(Math.cos(p.userData.a)*p.userData.r,.35+Math.sin(p.userData.a*1.7)*.7+p.userData.h*.35,Math.sin(p.userData.a)*p.userData.r)}const target=new THREE.Vector3(player.position.x,player.position.y+3.8,player.position.z+7.8);camera.position.lerp(target,.08);camera.lookAt(player.position.x,1.2,player.position.z);renderer.render(scene,camera)}requestAnimationFrame(loop);
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(e){throw e}
}catch(e){console.error(e);loading.innerHTML='<div id="err"><div style="font-size:55px">⚠️</div><b>تعذر تشغيل اللعبة</b><br>سيتم إظهار الخطأ بدل شاشة تحميل لا تنتهي.<br><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div>'}
</script></body></html>
