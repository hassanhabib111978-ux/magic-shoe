<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>الحذاء السحري — الفصل الأول</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07151d;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}body{position:fixed;inset:0}canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;direction:ltr}.pill,.quest{background:#061321cc;border:1px solid #ffffff22;backdrop-filter:blur(12px);box-shadow:0 8px 28px #0006}.pill{padding:9px 12px;border-radius:15px;font-weight:900}.stats{display:flex;gap:7px}.quest{position:absolute;right:12px;top:58px;width:min(350px,calc(100vw - 24px));padding:11px 14px;border-radius:17px;text-align:right}.quest b{display:block;color:#f5d796;font-size:11px;margin-bottom:3px}.quest span{font-size:13px;font-weight:850}.stick{position:absolute;left:20px;bottom:20px;width:124px;height:124px;border-radius:50%;background:#06132199;border:1px solid #ffffff25;pointer-events:auto}.stick:before{content:'';position:absolute;inset:15px;border:1px dashed #ffffff22;border-radius:50%}.stick:after{content:'';position:absolute;width:54px;height:54px;left:34px;top:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#a8cbd7 45%,#657c8b);transform:translate(var(--x,0),var(--y,0));opacity:var(--a,0);box-shadow:0 8px 24px #0008}.action{position:absolute;right:20px;bottom:22px;width:82px;height:82px;border:1px solid #ffffff38;border-radius:50%;background:radial-gradient(circle at 35% 25%,#f0caff,#8a54dc 55%,#42206d);color:#fff;font-weight:900;pointer-events:auto}.title{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#164653ee,#030812f8 70%);pointer-events:auto;transition:opacity .5s}.title.hide{opacity:0;pointer-events:none}.card{text-align:center;padding:24px}.logo{font-size:86px;filter:drop-shadow(0 0 30px #d28cff)}h1{margin:0;font-size:clamp(38px,9vw,64px);font-weight:1000}h2{margin:2px 0 22px;font-size:14px;color:#d8e5ea}.btn{border:0;border-radius:18px;padding:14px 28px;background:linear-gradient(135deg,#e1a5ff,#7048c5);color:#fff;font-weight:900;font-size:16px;min-width:190px}.tip{margin-top:14px;color:#9fb7c4;font-size:11px}.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:15px 21px;border-radius:20px;background:#071522ee;border:1px solid #ffffff20;box-shadow:0 20px 70px #0009;text-align:center;font-weight:950;opacity:0;transition:.25s;white-space:nowrap}.toast.show{opacity:1}.error{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;background:#07101a}.error b{font-size:22px}.error small{display:block;color:#a9bbc5;margin:12px 0 18px;line-height:1.8}</style></head><body><canvas id="game"></canvas><div class="ui"><div class="top"><div class="pill">👞 الحذاء السحري</div><div class="stats"><div class="pill">★ <span id="stars">0</span></div><div class="pill">◈ <span id="coins">0</span></div></div></div><div class="quest"><b>المهمة الحالية</b><span id="quest">استكشف الغابة وابحث عن الرمز السحري</span></div><div class="stick" id="stick"></div><button class="action" id="action">تفاعل</button><div class="toast" id="toast"></div><div class="title" id="title"><div class="card"><div class="logo">👞</div><h1>الحذاء السحري</h1><h2>مغامرة ثلاثية الأبعاد — الفصل الأول</h2><button class="btn" id="start">ابدأ المغامرة</button><div class="tip">استكشف • اكتشف • افتح قدرات جديدة</div></div></div></div><script type="module">const $=id=>document.getElementById(id);const fail=e=>{console.error(e);document.body.insertAdjacentHTML('beforeend','<div class="error"><div><b>تعذر تشغيل المشهد ثلاثي الأبعاد</b><small>إذا ظهر هذا الخطأ بعد تحديث الصفحة، فالمشكلة في دعم WebGL2 في المتصفح أو الجهاز.</small><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div></div>')};try{const THREE=await import('./vendor/three.module.js');const canvas=$('game');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight,false);renderer.setClearColor(0x07151d,1);renderer.shadowMap.enabled=true;const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x0b2930,35,150);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);camera.position.set(0,7,14);camera.lookAt(0,1,-3);scene.add(new THREE.HemisphereLight(0xb5edff,0x172719,2.2));const sun=new THREE.DirectionalLight(0xffdfb0,3);sun.position.set(-20,30,15);sun.castShadow=true;scene.add(sun);const mat=(c,r=.8,m=0,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,emissive:e,emissiveIntensity:e?1.4:0});const world=new THREE.Group();scene.add(world);const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),mat(0x184b3b,1));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;world.add(ground);const path=new THREE.Mesh(new THREE.PlaneGeometry(8,100),mat(0x665e51,1));path.rotation.x=-Math.PI/2;path.position.y=.02;world.add(path);function tree(x,z,s){const g=new THREE.Group();g.position.set(x,0,z);const t=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.42*s,3*s,8),mat(0x4b3023));t.position.y=1.5*s;t.castShadow=true;g.add(t);for(let i=0;i<3;i++){const c=new THREE.Mesh(new THREE.ConeGeometry((1.8-i*.2)*s,2.4*s,10),mat([0x185b48,0x267052,0x358b61][i]));c.position.y=(3+i*.95)*s;c.castShadow=true;g.add(c)}world.add(g)}for(let i=-5;i<=5;i++){tree(-8-Math.abs(i)*1.2,i*9-8,.85+(Math.abs(i)%3)*.15);tree(8+Math.abs(i)*1.2,i*9-8,.85+((Math.abs(i)+1)%3)*.15)}function rock(x,z,s){const r=new THREE.Mesh(new THREE.DodecahedronGeometry(1,1),mat(0x53676a));r.position.set(x,.35*s,z);r.scale.set(1.2*s,.65*s,.9*s);r.castShadow=true;world.add(r)}for(let i=0;i<18;i++)rock((i%2?1:-1)*(4+Math.random()*5),-45+i*5,.3+Math.random()*.7);const shrine=new THREE.Group();shrine.position.set(-10,0,-12);world.add(shrine);for(let i=0;i<3;i++){const p=new THREE.Mesh(new THREE.CylinderGeometry(.7,1,5,12),mat(0x66777a));p.position.set((i-1)*2.4,2.5,0);p.castShadow=true;shrine.add(p)}const glow=new THREE.PointLight(0x45e5c5,18,12);glow.position.set(0,4,0);shrine.add(glow);const orb=new THREE.Mesh(new THREE.OctahedronGeometry(.65),mat(0xc6fff2,.15,0,0x55ffcf));orb.position.set(0,4,0);shrine.add(orb);const shoe=new THREE.Group();shoe.position.set(2.8,1.2,-10);world.add(shoe);const purple=mat(0x55227d,.3,.2,0x17051f),leather=mat(0x9d4fca,.32,.08,0x300b3f),gold=mat(0xf1c86b,.2,.72,0x6a3b08),cyan=mat(0x8fffea,.15,0,0x21e6c0);const sole=new THREE.Mesh(new THREE.CapsuleGeometry(1.25,.85,10,20),purple);sole.rotation.z=Math.PI/2;sole.scale.z=.55;sole.castShadow=true;shoe.add(sole);const upper=new THREE.Mesh(new THREE.SphereGeometry(1.15,24,16),leather);upper.scale.set(1.2,.58,.75);upper.position.y=.55;upper.castShadow=true;shoe.add(upper);const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(.6,.4,0),new THREE.Vector3(1.6,.35,0),new THREE.Vector3(2.5,.5,0),new THREE.Vector3(3.25,1.05,0),new THREE.Vector3(3.45,1.65,0)]);const toe=new THREE.Mesh(new THREE.TubeGeometry(curve,28,.38,12,false),leather);toe.castShadow=true;shoe.add(toe);const ridge=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(.6,.75,0),new THREE.Vector3(1.7,.7,0),new THREE.Vector3(2.5,.9,0),new THREE.Vector3(3.2,1.35,0),new THREE.Vector3(3.45,1.8,0)]),28,.065,8,false),gold);shoe.add(ridge);const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.42),cyan);gem.position.set(0,1.05,0);shoe.add(gem);const shoeLight=new THREE.PointLight(0x5fffe1,15,9);shoeLight.position.set(0,1,0);shoe.add(shoeLight);const ring=new THREE.Mesh(new THREE.TorusGeometry(2,.045,8,48),cyan);ring.rotation.x=Math.PI/2;shoe.add(ring);const player=new THREE.Group();player.position.set(0,0,5);world.add(player);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.9,8,16),mat(0x3c5b91));body.position.y=1.15;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.43,18,14),mat(0xd59a72));head.position.y=2.15;head.castShadow=true;player.add(head);const hat=new THREE.Mesh(new THREE.TorusGeometry(.43,.13,10,20),gold);hat.position.y=2.4;hat.rotation.x=Math.PI/2;player.add(hat);let running=false,stars=0,coins=0,joy={x:0,y:0},drag=false;const stick=$('stick');function joySet(e){const r=stick.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/48,y=(e.clientY-r.top-r.height/2)/48,l=Math.hypot(x,y)||1;joy=l>1?{x:x/l,y:y/l}:{x,y};stick.style.setProperty('--x',joy.x*32+'px');stick.style.setProperty('--y',joy.y*32+'px');stick.style.setProperty('--a',1)}stick.onpointerdown=e=>{drag=true;stick.setPointerCapture(e.pointerId);joySet(e)};stick.onpointermove=e=>{if(drag)joySet(e)};stick.onpointerup=stick.onpointercancel=()=>{drag=false;joy={x:0,y:0};stick.style.setProperty('--a',0)};function toast(t){const q=$('toast');q.textContent=t;q.classList.add('show');setTimeout(()=>q.classList.remove('show'),1600)}$('start').onclick=()=>{$('title').classList.add('hide');running=true;toast('ابدأ البحث عن الحذاء السحري ✨')};$('action').onclick=()=>{if(player.position.distanceTo(shoe.position)<5){stars++;coins+=5;$('stars').textContent=stars;$('coins').textContent=coins;$('quest').textContent='وجدت الحذاء السحري! اكتشف قوته';toast('✨ الحذاء اختارك! ✨')}else toast('اقترب أكثر من الحذاء السحري')};let prev=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-prev)/1000,.033);prev=now;if(running&&Math.hypot(joy.x,joy.y)>.05){const speed=4.5;player.position.x+=joy.x*speed*dt;player.position.z+=joy.y*speed*dt;player.rotation.y=Math.atan2(joy.x,joy.y)}shoe.position.y=1.2+Math.sin(now*.002)*.12;shoe.rotation.y=Math.sin(now*.0007)*.25;ring.rotation.z=now*.0008;gem.rotation.y=now*.0015;shoeLight.intensity=13+Math.sin(now*.004)*4;const target=new THREE.Vector3(player.position.x,5.5,player.position.z+10);camera.position.lerp(target,.08);camera.lookAt(player.position.x,1.3,player.position.z-4);renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)})}catch(e){fail(e)}</script></body></html>
