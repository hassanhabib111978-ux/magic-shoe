<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07121f"><title>الحذاء السحري — الفصل الأول</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a12;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif}body{position:fixed;inset:0}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#050a12}.load{text-align:center;font-weight:900}.bar{width:210px;height:5px;background:#182638;border-radius:8px;overflow:hidden;margin:14px auto}.bar i{display:block;width:55%;height:100%;background:#d6a0ff;animation:l 1s infinite}@keyframes l{from{transform:translateX(-210px)}to{transform:translateX(210px)}}.error{max-width:340px;text-align:center;line-height:1.8;padding:20px}.error b{font-size:20px}.error button,.start{margin-top:15px;border:0;padding:14px 28px;border-radius:18px;background:linear-gradient(135deg,#e0a3ff,#704cc6);color:#fff;font-weight:900}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;direction:ltr}.pill,.quest,.hint,.brand{background:#071423cc;border:1px solid #ffffff1c;backdrop-filter:blur(14px);box-shadow:0 8px 30px #0004}.pill{padding:9px 13px;border-radius:16px;font-weight:800}.stats{display:flex;gap:8px}.brand{padding:9px 14px;border-radius:18px;font-weight:900}.quest{position:absolute;top:70px;right:14px;width:min(340px,calc(100vw - 28px));padding:13px 16px;border-radius:18px;text-align:right}.quest b{display:block;color:#f3d58b;font-size:12px;margin-bottom:5px}.quest span{font-weight:800}.hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:18px;font-size:12px;white-space:nowrap}.action{position:absolute;right:22px;bottom:24px;pointer-events:auto;width:78px;height:78px;border-radius:50%;border:1px solid #ffffff35;background:linear-gradient(135deg,#e0a3ff,#6944ae);color:#fff;font-weight:900;box-shadow:0 0 35px #a56cff55}.action:active{transform:scale(.94)}.stick{position:absolute;left:22px;bottom:24px;width:118px;height:118px;border-radius:50%;background:#07142399;border:1px solid #ffffff22;pointer-events:auto;touch-action:none}.stick:after{content:'';position:absolute;width:52px;height:52px;left:32px;top:32px;border-radius:50%;background:#e5f3f8aa;border:1px solid #fff6;box-shadow:0 5px 18px #0006;transform:translate(var(--jx,0),var(--jy,0));opacity:var(--a,0);transition:opacity .15s}.title{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#173a4ee8,#030811f5 70%);pointer-events:auto;transition:opacity .6s}.title.hide{opacity:0;pointer-events:none}.card{text-align:center;padding:28px}.logo{font-size:82px;filter:drop-shadow(0 0 28px #d89aff)}h1{font-size:clamp(34px,8vw,62px);margin:4px 0;font-weight:1000}h2{font-size:15px;color:#d6e4ed;margin:0 0 24px}.tip{margin-top:15px;color:#a9c0ce;font-size:12px}.progress{position:absolute;left:50%;top:128px;transform:translateX(-50%);width:min(270px,70vw);height:4px;background:#ffffff18;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#73f2cf,#d89aff);transition:width .5s}</style></head><body><div class="loading" id="loading"><div class="load"><div style="font-size:44px">👟</div><div>جاري تجهيز عالم الحذاء السحري</div><div class="bar"><i></i></div></div></div><canvas id="game"></canvas><div class="ui"><div class="top"><div class="brand">👟 الحذاء السحري</div><div class="stats"><div class="pill">★ <span id="stars">0</span></div><div class="pill">◈ <span id="coins">0</span></div></div></div><div class="quest"><b>المهمة الحالية</b><span id="quest">استكشف الغابة وابحث عن الرمز السحري</span></div><div class="progress"><i id="progress"></i></div><div class="hint" id="hint">اسحب الدائرة للتحرك — الحركة أصبحت سلسة</div><div class="stick" id="stick"></div><button class="action" id="action">تفاعل</button><div class="title" id="title"><div class="card"><div class="logo">👟</div><h1>الحذاء السحري</h1><h2>مغامرة ثلاثية الأبعاد — الفصل الأول</h2><button class="start" id="start">ابدأ المغامرة</button><div class="tip">استكشف • اكتشف • افتح قدرات جديدة</div></div></div></div><script type="module">const loading=document.getElementById('loading');const fail=e=>{console.error(e);loading.innerHTML='<div class="error"><div style="font-size:44px">⚠️</div><b>تعذر تجهيز عالم 3D</b><br><span>حدث خطأ أثناء تحميل أحد ملفات العالم.</span><br><button onclick="location.reload()">إعادة المحاولة</button></div>'};Promise.all([import('./vendor/three.module.js'),import('./vendor/GLTFLoader.js')]).then(([THREE,GLTF])=>{try{const T=THREE;const GLTFLoader=GLTF.GLTFLoader;const canvas=document.getElementById('game');const R=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.setSize(innerWidth,innerHeight);R.outputColorSpace=T.SRGBColorSpace;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.12;R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;const S=new T.Scene();S.background=new T.Color(0x07131d);S.fog=new T.FogExp2(0x0b2630,.015);const C=new T.PerspectiveCamera(60,innerWidth/innerHeight,.1,450);S.add(new T.HemisphereLight(0xa8ddff,0x162519,1.9));const sun=new T.DirectionalLight(0xffe5bd,3.2);sun.position.set(-25,30,12);sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;S.add(sun);const fill=new T.PointLight(0x74e9d2,18,45);fill.position.set(0,8,0);S.add(fill);const world=new T.Group();S.add(world);const mat=(c,r=.75,e=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:.04,emissive:e});const ground=new T.Mesh(new T.CircleGeometry(95,128),mat(0x173c35,1));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;world.add(ground);const path=new T.Mesh(new T.PlaneGeometry(7,120),mat(0x53615c,.95));path.rotation.x=-Math.PI/2;path.position.y=.015;world.add(path);function rock(x,z,s){const m=new T.Mesh(new T.IcosahedronGeometry(1,1),mat(0x435b60,.95));m.position.set(x,s*.45,z);m.scale.set(s*1.3,s*.8,s);m.rotation.set(Math.random(),Math.random(),Math.random());m.castShadow=true;m.receiveShadow=true;world.add(m)}for(let i=0;i<45;i++){const a=Math.random()*Math.PI*2,r=12+Math.random()*55;rock(Math.cos(a)*r,Math.sin(a)*r,.35+Math.random()*1.15)}function tree(x,z,s=1){const g=new T.Group();g.position.set(x,0,z);const trunk=new T.Mesh(new T.CylinderGeometry(.28*s,.48*s,3.6*s,10),mat(0x4c3026,.92));trunk.position.y=1.8*s;trunk.castShadow=true;g.add(trunk);const colors=[0x155a49,0x1b7358,0x2b8660];for(let i=0;i<3;i++){const c=new T.Mesh(new T.ConeGeometry((2.2-i*.25)*s,3.7*s,12),mat(colors[i],.88));c.position.y=(3.2+i*1.35)*s;c.castShadow=true;g.add(c)}world.add(g)}for(let i=0;i<42;i++){const a=Math.random()*6.28,r=15+Math.random()*42;tree(Math.cos(a)*r,Math.sin(a)*r,.72+Math.random()*.8)}const ruin=new T.Group();ruin.position.set(-10,0,-12);for(let i=0;i<5;i++){const p=new T.Mesh(new T.BoxGeometry(1.8,6.5,1.8),mat(0x596a70,.72));p.position.set((i-2)*2.4,3.25,0);p.rotation.z=(Math.random()-.5)*.08;p.castShadow=true;ruin.add(p)}const arch=new T.Mesh(new T.TorusGeometry(2.1,.16,18,64,Math.PI),mat(0x76e8ce,.35,0x2bd0aa));arch.position.set(0,4.3,.8);arch.rotation.x=Math.PI/2;ruin.add(arch);world.add(ruin);const runeLight=new T.PointLight(0x4be6c7,25,12);runeLight.position.set(-10,4,-11);world.add(runeLight);const shoe=new T.Group();shoe.position.set(8,2.2,-9);const sole=new T.Mesh(new T.CapsuleGeometry(1.25,.95,10,24),mat(0x5e327f,.42));sole.rotation.z=Math.PI/2;sole.scale.z=.62;sole.castShadow=true;shoe.add(sole);const upper=new T.Mesh(new T.SphereGeometry(1.08,32,20),mat(0xc17be9,.32));upper.scale.set(1.08,.55,.72);upper.position.y=.62;upper.castShadow=true;shoe.add(upper);const tongue=new T.Mesh(new T.BoxGeometry(.5,.85,.15),mat(0xe8b7ff,.38));tongue.position.set(.1,.85,.56);tongue.rotation.x=-.15;shoe.add(tongue);for(let i=-2;i<=2;i++){const lace=new T.Mesh(new T.TorusGeometry(.16,.035,8,18),mat(0xffe9a9,.3,0xffb83d));lace.scale.x=1.5;lace.rotation.x=Math.PI/2;lace.position.set(-.3+i*.22,.82,.72);shoe.add(lace)}const gem=new T.Mesh(new T.OctahedronGeometry(.3),mat(0xffe7a4,.2,0xffa21d));gem.position.set(-.35,1.02,.25);shoe.add(gem);const shoeGlow=new T.PointLight(0xd58aff,18,10);shoe.add(shoeGlow);world.add(shoe);const portal=new T.Group();portal.position.set(18,3,-15);const ring=new T.Mesh(new T.TorusGeometry(2.8,.32,24,72),mat(0x79f4d6,.25,0x3ee3bf));portal.add(ring);const core=new T.Mesh(new T.CircleGeometry(2.45,64),new T.MeshBasicMaterial({color:0x132f38,transparent:true,opacity:.72}));core.rotation.y=Math.PI;portal.add(core);portal.add(new T.PointLight(0x62e9ca,35,16));portal.visible=false;world.add(portal);const player=new T.Group();player.position.set(0,0,7);world.add(player);let character=null;let characterMixer=null;const loader=new GLTFLoader();loader.load('./assets/character.glb',g=>{character=g.scene;character.scale.setScalar(1.65);character.position.y=0;character.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});player.add(character);if(g.animations?.length){characterMixer=new T.AnimationMixer(character);g.animations.forEach(a=>characterMixer.clipAction(a).play())}},undefined,e=>console.warn('character load',e));const fallback=new T.Group();const fbBody=new T.Mesh(new T.CapsuleGeometry(.5,1.25,8,16),mat(0x63408a,.55));fbBody.position.y=1.35;fallback.add(fbBody);const fbHead=new T.Mesh(new T.SphereGeometry(.45,24,16),mat(0xe9c4a5,.8));fbHead.position.y=2.42;fallback.add(fbHead);fallback.visible=false;player.add(fallback);let stars=0,coins=0,stage=0,started=false;try{const x=JSON.parse(localStorage.getItem('magic_shoe_3d')||'{}');stars=x.stars||0;coins=x.coins||0;stage=x.stage||0}catch(e){}const $=id=>document.getElementById(id);$('stars').textContent=stars;$('coins').textContent=coins;function quest(){$('quest').textContent=stage===0?'استكشف الغابة وابحث عن الرمز السحري':stage===1?'اتبع الأثر واعثر على الحذاء السحري':stage===2?'اقترب من البوابة السحرية':'المغامرة الأولى اكتملت — العصا السحرية تنتظرك';$('progress').style.width=(stage/3*100)+'%'}quest();const save=()=>localStorage.setItem('magic_shoe_3d',JSON.stringify({stars,coins,stage}));$('start').onclick=()=>{started=true;$('title').classList.add('hide');$('hint').textContent='اسحب الدائرة للتحرك — اضغط تفاعل عند اقترابك من الهدف'};$('action').onclick=()=>{if(!started)return;if(stage===0&&player.position.distanceTo(ruin.position)<9){stage=1;stars++;coins+=10}else if(stage===1&&player.position.distanceTo(shoe.position)<6){stage=2;stars+=3;coins+=35}else if(stage===2&&player.position.distanceTo(portal.position)<7){stage=3;stars+=5;coins+=60}quest();$('stars').textContent=stars;$('coins').textContent=coins;save()};const input={x:0,y:0},stick=$('stick');let active=false,pointerId=null;function setJoy(x,y){const r=stick.getBoundingClientRect();let dx=(x-(r.left+r.width/2))/(r.width*.36),dy=(y-(r.top+r.height/2))/(r.height*.36);const len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}input.x=dx;input.y=dy;stick.style.setProperty('--jx',(dx*24)+'px');stick.style.setProperty('--jy',(dy*24)+'px');stick.style.setProperty('--a','1')}function resetJoy(){input.x=0;input.y=0;stick.style.setProperty('--jx','0px');stick.style.setProperty('--jy','0px');stick.style.setProperty('--a','0')}stick.addEventListener('pointerdown',e=>{active=true;pointerId=e.pointerId;stick.setPointerCapture(pointerId);setJoy(e.clientX,e.clientY)});stick.addEventListener('pointermove',e=>{if(active&&e.pointerId===pointerId)setJoy(e.clientX,e.clientY)});stick.addEventListener('pointerup',resetJoy);stick.addEventListener('pointercancel',resetJoy);stick.addEventListener('lostpointercapture',resetJoy);let vel=new T.Vector3();let last=performance.now();function resize(){C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;const t=now*.001;if(characterMixer)characterMixer.update(dt);shoe.position.y=2.2+Math.sin(t*2.2)*.25;shoe.rotation.y+=dt*.7;ring.rotation.y+=dt*.55;ring.rotation.z=Math.sin(t)*.12;const move=new T.Vector3(input.x,0,input.y);if(started&&move.lengthSq()>0.01){move.normalize();const speed=7.2;vel.x+=move.x*speed*dt*7;vel.z+=move.z*speed*dt*7;const max=7.2;const sp=Math.hypot(vel.x,vel.z);if(sp>max){vel.x*=max/sp;vel.z*=max/sp}player.rotation.y=T.MathUtils.lerp(player.rotation.y,Math.atan2(vel.x,vel.z),Math.min(1,dt*12))}else{vel.x*=Math.pow(.001,dt);vel.z*=Math.pow(.001,dt)}player.position.x+=vel.x*dt;player.position.z+=vel.z*dt;player.position.x=T.MathUtils.clamp(player.position.x,-55,55);player.position.z=T.MathUtils.clamp(player.position.z,-55,55);if(character){character.position.y=Math.abs(Math.sin(t*8))*Math.min(.055,Math.hypot(vel.x,vel.z)*.012);character.rotation.z=Math.sin(t*8)*Math.min(.025,Math.hypot(vel.x,vel.z)*.004)}const target=new T.Vector3(player.position.x,2.4,player.position.z);const desired=new T.Vector3(player.position.x,5.2,player.position.z+11);C.position.lerp(desired,.075);C.lookAt(target);portal.visible=stage>=2;R.render(S,C);requestAnimationFrame(loop)}requestAnimationFrame(loop);loading.style.display='none'}catch(e){fail(e)}}).catch(fail);</script></body></html>
