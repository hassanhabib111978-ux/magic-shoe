<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>الحذاء السحري — مغامرة</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b16;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif}body{position:fixed;inset:0;color:#fff}#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#06101c;z-index:10;transition:.5s;color:#fff}#loading.hide{opacity:0;pointer-events:none}.loadBox{text-align:center}.loadLogo{font-size:54px;filter:drop-shadow(0 0 20px #d98cff)}.loadTitle{font-size:25px;font-weight:900;margin-top:8px}.bar{width:180px;height:5px;background:#203247;border-radius:9px;margin:18px auto;overflow:hidden}.bar i{display:block;height:100%;width:60%;background:linear-gradient(90deg,#7be6d1,#d99cff);animation:load 1.2s infinite}@keyframes load{from{transform:translateX(170px)}to{transform:translateX(-170px)}}
</style>
</head>
<body>
<div id="loading"><div class="loadBox"><div class="loadLogo">👟</div><div class="loadTitle">الحذاء السحري</div><div class="bar"><i></i></div><small>جاري تجهيز المغامرة...</small></div></div>
<canvas id="game"></canvas>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,D,S,t=0,last=0,shake=0;const world={w:2200,h:1000};
const saveKey='magic_shoe_premium_v1';
let state={px:360,py:650,stars:0,coins:0,clue:0,shoe:false,portal:false,scene:'play',dialog:'',toast:'استكشف الغابة وابحث عن أول سر.'};
try{Object.assign(state,JSON.parse(localStorage.getItem(saveKey)||'{}'))}catch(e){}
const keys={},touch={x:0,y:0,down:false};
const particles=[];for(let i=0;i<120;i++)particles.push({x:Math.random()*world.w,y:100+Math.random()*600,s:1+Math.random()*3,a:Math.random()*6.28,v:.3+Math.random()*.8});
function save(){try{localStorage.setItem(saveKey,JSON.stringify(state))}catch(e){}}
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;S=Math.min(W/1280,H/720);x.setTransform(D*S,0,0,D*S,0,0)}addEventListener('resize',resize);resize();
function pointer(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function worldPoint(){return{x:state.px,y:state.py}}
function move(dx,dy){const n=Math.hypot(dx,dy)||1;state.px=Math.max(100,Math.min(world.w-100,state.px+dx/n*7));state.py=Math.max(470,Math.min(790,state.py+dy/n*7))}
function interact(){
 const p=worldPoint();
 if(state.scene==='intro'){state.scene='play';state.dialog='';return}
 if(!state.clue&&dist(p,{x:700,y:650})<145){state.clue=1;state.stars++;state.coins+=10;state.toast='وجدت الرمز الأول. شيء ما يقودك إلى أعماق الغابة.';state.dialog='الرمز يتوهج... يبدو أن شخصاً أخفى شيئاً ثميناً هنا.';shake=5;save();return}
 if(state.clue&&!state.shoe&&dist(p,{x:1500,y:570})<190){state.shoe=true;state.stars+=3;state.coins+=35;state.toast='الحذاء السحري أصبح لك! قدرة «الخطوة الخفية» فُتحت.';state.dialog='وجدته! لكن هذه ليست نهاية الرحلة... هناك أثر سحري خلف الأشجار.';shake=12;save();return}
 if(state.shoe&&!state.portal&&dist(p,{x:1930,y:570})<190){state.portal=true;state.stars+=5;state.coins+=60;state.toast='اكتشفت البوابة! مهمة العصا السحرية متاحة.';state.dialog='الضوء يفتح طريقاً جديداً... مغامرة العصا تنتظرك.';shake=16;save();return}
 state.dialog='اقترب أكثر من العنصر المضيء ثم اضغط «تفاعل».';
}
function down(e){const p=pointer(e);touch.down=true;touch.x=p.x;touch.y=p.y;if(p.x>1030&&p.y>560){interact();return}if(state.scene==='intro'){interact();return}touch.lastX=p.x;touch.lastY=p.y}
function movePointer(e){if(!touch.down)return;const p=pointer(e),dx=p.x-touch.lastX,dy=p.y-touch.lastY;if(Math.hypot(dx,dy)>3){move(dx,dy);touch.lastX=p.x;touch.lastY=p.y}}
function up(){touch.down=false}c.onpointerdown=down;c.onpointermove=movePointer;c.onpointerup=up;c.onpointercancel=up;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='Enter'||e.key===' ')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function rr(a,b,w,h,r,f,al=1){x.save();x.globalAlpha=al;x.fillStyle=f;x.beginPath();x.roundRect(a,b,w,h,r);x.fill();x.restore()}
function text(s,a,b,size=18,align='left',weight=600,al=1){x.save();x.globalAlpha=al;x.fillStyle='#fff';x.font=`${weight} ${size}px system-ui`;x.textAlign=align;x.textBaseline='middle';x.fillText(s,a,b);x.restore()}
function glow(a,b,r,col,al=.2){let q=x.createRadialGradient(a,b,0,a,b,r);q.addColorStop(0,col);q.addColorStop(1,'transparent');x.save();x.globalAlpha=al;x.fillStyle=q;x.beginPath();x.arc(a,b,r,0,7);x.fill();x.restore()}
function path(points){x.beginPath();points.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke()}
function tree(px,py,sc,far=false){x.save();x.translate(px,py);x.scale(sc,sc);x.fillStyle=far?'#122b39':'#0d251e';x.fillRect(-10,0,20,150);for(let i=0;i<5;i++){x.fillStyle=i%2?'#174536':'#1d5949';x.beginPath();x.arc((i-2)*25,-i*18,48,0,7);x.fill()}x.fillStyle='#26715b';x.globalAlpha=.5;x.beginPath();x.arc(-10,-55,35,0,7);x.fill();x.restore()}
function ruin(px,py){x.save();x.translate(px,py);x.fillStyle='#243c4b';x.beginPath();x.moveTo(-100,0);x.lineTo(-88,-180);x.lineTo(-55,-205);x.lineTo(-25,-175);x.lineTo(20,-215);x.lineTo(82,-190);x.lineTo(100,0);x.closePath();x.fill();for(let i=0;i<4;i++){x.fillStyle='#385565';x.fillRect(-75+i*48,-150+(i%2)*18,22,150)}x.fillStyle='#0a1824';x.fillRect(-30,-100,60,100);x.restore()}
function rune(px,py){x.save();x.translate(px,py);x.rotate(t*.003);x.strokeStyle='#7de9d2';x.lineWidth=4;x.shadowColor='#65ead2';x.shadowBlur=15;x.beginPath();x.arc(0,0,40,0,7);x.stroke();x.beginPath();x.moveTo(0,-29);x.lineTo(27,25);x.lineTo(-27,25);x.closePath();x.stroke();x.restore();glow(px,py,130,'#61e5cf',.15)}
function shoe(px,py){const bob=Math.sin(t*.05)*8;x.save();x.translate(px,py+bob);x.rotate(-.08);glow(0,0,180,'#dc8cff',.25);x.shadowColor='#cc83ff';x.shadowBlur=30;x.fillStyle='#7544a7';x.beginPath();x.moveTo(-75,25);x.quadraticCurveTo(-70,-30,-25,-48);x.quadraticCurveTo(28,-65,55,-20);x.lineTo(95,8);x.quadraticCurveTo(102,35,62,48);x.lineTo(-42,48);x.quadraticCurveTo(-85,45,-75,25);x.fill();x.shadowBlur=0;x.fillStyle='#e6a5ef';x.beginPath();x.moveTo(-37,-34);x.quadraticCurveTo(0,-5,37,-29);x.lineTo(24,-3);x.quadraticCurveTo(-4,12,-43,-12);x.closePath();x.fill();x.fillStyle='#ffe5a0';x.beginPath();x.arc(0,-48,11,0,7);x.fill();x.restore();text('الحذاء السحري',px,py+105,18,'center',800,.95)}
function portal(px,py){const pulse=1+Math.sin(t*.04)*.08;x.save();x.translate(px,py);x.scale(pulse,pulse);glow(0,0,190,'#67e8c9',.25);x.strokeStyle='#9af5d8';x.lineWidth=9;x.shadowColor='#55e7bf';x.shadowBlur=35;x.beginPath();x.ellipse(0,0,72,105,0,0,7);x.stroke();x.shadowBlur=0;x.strokeStyle='#d5fff0';x.lineWidth=2;for(let i=0;i<5;i++){x.beginPath();x.arc(0,0,38+i*11,-1.2+i*.2,1.3+i*.2);x.stroke()}x.restore();text('بوابة مجهولة',px,py+140,17,'center',800,.9)}
function hero(px,py){const bob=Math.sin(t*.08)*3;x.save();x.translate(px,py+bob);x.shadowColor='#f6d889';x.shadowBlur=15;x.fillStyle='#e9eef4';x.beginPath();x.arc(0,-74,25,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#3b2959';x.beginPath();x.roundRect(-39,-48,78,88,22);x.fill();x.fillStyle='#a875d1';x.beginPath();x.moveTo(-39,-25);x.quadraticCurveTo(-75,0,-50,40);x.lineTo(-28,25);x.closePath();x.fill();x.fillStyle='#f6d889';x.beginPath();x.arc(38,-5,10,0,7);x.fill();x.fillStyle='#171522';x.fillRect(-27,38,17,43);x.fillRect(10,38,17,43);x.restore()}
function background(){let sky=x.createLinearGradient(0,0,0,720);sky.addColorStop(0,'#08152b');sky.addColorStop(.42,'#193e55');sky.addColorStop(1,'#081b1b');x.fillStyle=sky;x.fillRect(0,0,1280,720);x.fillStyle='#ffecc4';x.shadowColor='#fff0bd';x.shadowBlur=35;x.beginPath();x.arc(1050,110,42,0,7);x.fill();x.shadowBlur=0;for(let i=0;i<55;i++){x.fillStyle=i%3?'#cfeeff':'#fff0bf';x.globalAlpha=.18+(i%4)*.12;x.fillRect((i*83)%1280,30+(i*47)%230,2+(i%2),2+(i%2))}x.globalAlpha=1;
 // distant mountains
 x.fillStyle='#0b2132';x.beginPath();x.moveTo(0,400);x.lineTo(170,180);x.lineTo(350,360);x.lineTo(535,135);x.lineTo(720,350);x.lineTo(900,165);x.lineTo(1090,350);x.lineTo(1280,205);x.lineTo(1280,500);x.lineTo(0,500);x.fill();
 x.fillStyle='#12383a';x.beginPath();x.ellipse(640,485,760,250,0,0,7);x.fill();
 // path
 x.strokeStyle='#4b493e';x.lineWidth=125;x.lineCap='round';path([[1120,720],[1040,620],[930,550],[790,505],[650,490]]);x.strokeStyle='#625d50';x.lineWidth=92;path([[1120,720],[1040,620],[930,550],[790,505],[650,490]]);
 for(let i=0;i<13;i++)tree(20+i*105+(i%3)*18,350+(i%4)*35,.72+(i%3)*.1,true);for(let i=0;i<10;i++)tree(80+i*125,410+(i%3)*45,.9+(i%2)*.12,false);ruin(285,475);
}
function particlesDraw(){for(const p of particles){p.x-=p.v*.45;p.y+=Math.sin(t*.01+p.a)*.12;if(p.x<0)p.x=world.w;let sx=p.x-state.px+640,sy=p.y; if(sx>-20&&sx<1300&&sy>80&&sy<610){x.fillStyle='#b6ffe9';x.globalAlpha=.18+.2*Math.sin(t*.03+p.a);x.beginPath();x.arc(sx,sy,p.s,0,7);x.fill()}}x.globalAlpha=1}
function camera(){let cx=Math.max(0,Math.min(world.w-1280,state.px-640));return cx}
function drawWorld(){const cam=camera();x.save();x.translate(-cam,0); // world coordinates
 // base overlay already drawn in screen, redraw important objects in world space
 x.fillStyle='#143c38';x.beginPath();x.ellipse(1100,690,900,230,0,0,7);x.fill();
 for(let i=0;i<24;i++)tree(40+i*100+(i%4)*23,430+(i%5)*48,.8+(i%3)*.1,i<10);ruin(285,475);
 if(!state.clue)rune(700,650);else{glow(700,650,80,'#7de9d2',.12);text('✓',700,650,36,'center',900)}
 if(!state.shoe)shoe(1500,570);else{text('✓',1500,570,48,'center',900)}
 if(state.shoe&&!state.portal)portal(1930,570);else if(state.portal)text('✓',1930,570,48,'center',900);
 // floating guidance trail
 const targets=!state.clue?{x:700,y:650}:!state.shoe?{x:1500,y:570}:{x:1930,y:570};for(let i=0;i<7;i++){const q=state.px+(targets.x-state.px)*(i+1)/9,qy=state.py+(targets.y-state.py)*(i+1)/9+Math.sin(t*.04+i)*8;glow(q,qy,18,'#f5d27d',.12);x.fillStyle='#f5d27d';x.globalAlpha=.7;x.beginPath();x.arc(q,qy,3,0,7);x.fill()}x.globalAlpha=1;
 hero(state.px,state.py);x.restore();}
function hud(){rr(24,18,1232,86,24,'#06111c',.82);text('الحذاء السحري',55,50,28,'left',900);text('المغامرة الأولى',55,79,14,'left',500,.55);rr(865,34,125,52,17,'#152b3b');text('★ '+state.stars,927,60,19,'center',800);rr(1002,34,145,52,17,'#152b3b');text('◈ '+state.coins,1075,60,19,'center',800);rr(1160,34,70,52,17,'#1c3447');text('Ⅱ',1195,60,19,'center',800);
 const objective=!state.clue?'اعثر على الرمز القديم':!state.shoe?'اعثر على الحذاء السحري':!state.portal?'اكتشف البوابة الغامضة':'مهمة العصا السحرية متاحة';rr(785,118,445,84,20,'#06111c',.9);text('المهمة الحالية',1195,142,13,'right',600,.55);text(objective,1195,174,19,'right',850);if(state.shoe)rr(35,120,205,52,17,'#73499d',.9),text('👟  الخطوة الخفية',137,146,15,'center',800);
 rr(25,575,330,105,25,'#06111c',.86);text('الحركة',190,600,13,'center',600,.5);text('اسحب بإصبعك لاستكشاف العالم',190,628,15,'center',650);text('اضغط «تفاعل» عند اقترابك من السر',190,653,12,'center',500,.55);
 rr(1040,565,190,78,24,'#7b4bb0',.98);x.save();x.shadowColor='#bb85ff';x.shadowBlur=20;x.strokeStyle='#d9b4ff';x.lineWidth=2;x.stroke();x.restore();text('تفاعل',1135,604,22,'center',900);text('✦',1135,628,14,'center',500,.65);
 if(state.dialog){rr(340,570,660,92,23,'#071421',.96);text(state.dialog,670,603,16,'center',650);text('اضغط تفاعل للمتابعة',670,634,12,'center',500,.5)}
}
function intro(){x.fillStyle='#06101d';x.fillRect(0,0,1280,720);glow(640,330,310,'#9b62ff',.18);x.fillStyle='#162c3b';x.beginPath();x.arc(640,345,175,0,7);x.fill();shoe(640,330);text('الحذاء السحري',640,525,40,'center',950);text('المغامرة الأولى',640,560,20,'center',600,.7);rr(475,600,330,66,23,'#794caf');text('ابدأ المغامرة',640,634,21,'center',900);text('اضغط في أي مكان للبدء',640,690,13,'center',500,.5)}
function toast(){if(!state.toast)return;rr(365,220,550,58,18,'#071421',.93);text(state.toast,640,249,15,'center',700);if(t%300===299)state.toast=''}
function loop(now){t++;if(!last)last=now;if(keys.w||keys.arrowup)move(0,-1);if(keys.s||keys.arrowdown)move(0,1);if(keys.a||keys.arrowleft)move(-1,0);if(keys.d||keys.arrowright)move(1,0);x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9}background();if(state.scene==='intro')intro();else{drawWorld();hud();toast()}x.restore();requestAnimationFrame(loop)}
setTimeout(()=>document.getElementById('loading').classList.add('hide'),900);state.scene=state.scene||'intro';requestAnimationFrame(loop);
</script>
</body>
</html>
