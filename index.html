<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111d"><title>الحذاء السحري — الفصل الأول</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a12;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}body{position:fixed;inset:0}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#loading{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#183c4b,#040912 72%)}.loader{text-align:center;font-weight:900}.loader .shoe{font-size:64px;filter:drop-shadow(0 0 28px #d28cff);animation:float 1.8s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px) rotate(-4deg)}}.bar{width:230px;height:5px;margin:18px auto;background:#ffffff16;border-radius:9px;overflow:hidden}.bar i{display:block;width:42%;height:100%;background:linear-gradient(90deg,#5ef0d0,#d79aff);animation:load 1.2s infinite}@keyframes load{to{transform:translateX(550px)}}
#error{max-width:340px;text-align:center;line-height:1.8;padding:24px}.errorBtn,.start{border:0;border-radius:18px;padding:14px 28px;background:linear-gradient(135deg,#dba0ff,#7049c4);color:#fff;font-weight:950;box-shadow:0 10px 30px #7b4bc955}
.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;direction:ltr}.brand,.pill,.quest,.hint{background:#061321b8;border:1px solid #ffffff1b;backdrop-filter:blur(16px);box-shadow:0 8px 28px #0005}.brand{padding:10px 14px;border-radius:18px;font-weight:950}.stats{display:flex;gap:7px}.pill{padding:9px 12px;border-radius:15px;font-weight:850}.quest{position:absolute;right:12px;top:66px;width:min(350px,calc(100vw - 24px));padding:12px 15px;border-radius:18px;text-align:right}.quest b{display:block;color:#f5d796;font-size:11px;margin-bottom:4px}.quest span{font-weight:850;font-size:13px}.progress{position:absolute;top:121px;right:12px;width:min(350px,calc(100vw - 24px));height:4px;border-radius:8px;background:#ffffff18;overflow:hidden}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#5eeecf,#d899ff);transition:width .45s}
.hint{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);padding:9px 14px;border-radius:16px;font-size:11px;white-space:nowrap}.stick{position:absolute;left:20px;bottom:20px;width:126px;height:126px;border-radius:50%;background:#0613218f;border:1px solid #ffffff20;pointer-events:auto;touch-action:none;box-shadow:inset 0 0 30px #0004}.stick:before{content:'';position:absolute;inset:16px;border:1px dashed #ffffff13;border-radius:50%}.stick:after{content:'';position:absolute;width:54px;height:54px;left:35px;top:35px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b8d9e6 35%,#718a99);box-shadow:0 8px 22px #0008;transform:translate(var(--jx,0),var(--jy,0));opacity:var(--a,0);transition:opacity .12s}.action{position:absolute;right:20px;bottom:22px;width:82px;height:82px;border-radius:50%;border:1px solid #ffffff38;background:radial-gradient(circle at 35% 25%,#efc7ff,#8c55dc 55%,#44226e);color:#fff;font-weight:950;pointer-events:auto;box-shadow:0 0 34px #b76dff55}.action:active{transform:scale(.94)}
.title{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#164352ee,#030812f7 68%);pointer-events:auto;transition:opacity .7s}.title.hide{opacity:0;pointer-events:none}.card{text-align:center;padding:25px 28px}.logo{font-size:86px;filter:drop-shadow(0 0 30px #d28cff)}h1{margin:3px 0;font-size:clamp(38px,9vw,66px);font-weight:1000;letter-spacing:-2px}h2{margin:0 0 22px;font-size:14px;color:#d8e5ea}.tip{margin-top:15px;color:#9fb7c4;font-size:11px}.start{font-size:16px;min-width:190px}.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);padding:16px 22px;border-radius:22px;background:#071522e8;border:1px solid #ffffff20;box-shadow:0 20px 70px #0009;text-align:center;font-weight:950;opacity:0;transition:.35s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media(min-width:700px){.stick{left:28px;bottom:28px}.action{right:28px;bottom:28px}}
</style>
</head>
<body>
<div id="loading"><div class="loader"><div class="shoe">👟</div><div>جاري تجهيز عالم الحذاء السحري</div><div class="bar"><i></i></div><small style="color:#8ea7b5">بناء العالم ثلاثي الأبعاد…</small></div></div>
<canvas id="game"></canvas>
<div class="ui">
  <div class="top"><div class="brand">👟 الحذاء السحري</div><div class="stats"><div class="pill">★ <span id="stars">0</span></div><div class="pill">◈ <span id="coins">0</span></div></div></div>
  <div class="quest"><b>المهمة الحالية</b><span id="quest">استكشف الغابة وابحث عن الرمز السحري</span></div><div class="progress"><i id="progress"></i></div>
  <div class="hint" id="hint">اسحب الدائرة للتحرك</div><div class="stick" id="stick"></div><button class="action" id="action">تفاعل</button>
  <div class="toast" id="toast"></div>
  <div class="title" id="title"><div class="card"><div class="logo">👟</div><h1>الحذاء السحري</h1><h2>مغامرة ثلاثية الأبعاد — الفصل الأول</h2><button class="start" id="start">ابدأ المغامرة</button><div class="tip">استكشف • اكتشف • افتح قدرات جديدة</div></div></div>
</div>
<script type="module">
const loading=document.getElementById('loading');
const fail=e=>{console.error(e);loading.innerHTML='<div id="error"><div style="font-size:50px">⚠️</div><b>تعذر تشغيل عالم 3D</b><br><span>حدث خطأ في ملفات اللعبة أو WebGL.</span><br><button class="errorBtn" onclick="location.reload()">إعادة المحاولة</button></div>'};
Promise.all([import('./vendor/three.module.js'),import('./vendor/GLTFLoader.js')]).then(([T,G])=>{
try{
const THREE=T,GLTFLoader=G.GLTFLoader,canvas=document.getElementById('game');
const R=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,1.45));R.setSize(innerWidth,innerHeight);R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.18;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();S.background=new THREE.Color(0x07141d);S.fog=new THREE.FogExp2(0x0b2830,.0125);
const C=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,500);
S.add(new THREE.HemisphereLight(0xa9e9ff,0x162719,2.05));
const sun=new THREE.DirectionalLight(0xffdfb0,3.7);sun.position.set(-35,42,18);sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);sun.shadow.camera.left=-65;sun.shadow.camera.right=65;sun.shadow.camera.top=65;sun.shadow.camera.bottom=-65;sun.shadow.bias=-.00025;S.add(sun);
const moon=new THREE.DirectionalLight(0x77aaff,.65);moon.position.set(30,18,-35);S.add(moon);
const world=new THREE.Group();S.add(world);
const M=(c,r=.75,m=0,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,emissive:e,emissiveIntensity:e?1.4:0});
const ground=new THREE.Mesh(new THREE.CircleGeometry(120,160),M(0x153d35,1));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;world.add(ground);
const pathMat=M(0x5d645c,1);const path=new THREE.Mesh(new THREE.PlaneGeometry(6.5,170),pathMat);path.rotation.x=-Math.PI/2;path.position.y=.02;world.add(path);
function rock(x,z,s){const g=new THREE.Group();g.position.set(x,0,z);const a=new THREE.Mesh(new THREE.DodecahedronGeometry(1,1),M(0x52676b,.9));a.scale.set(1.35*s,.7*s,s);a.position.y=.38*s;a.rotation.set(Math.random(),Math.random(),Math.random());a.castShadow=a.receiveShadow=true;g.add(a);world.add(g)}
for(let i=0;i<60;i++){const a=Math.random()*6.28,r=10+Math.random()*58;if(Math.abs(Math.cos(a)*r)>4)rock(Math.cos(a)*r,Math.sin(a)*r,.35+Math.random()*1.25)}
function tree(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.52*s,3.4*s,10),M(0x4a3025,.95));trunk.position.y=1.7*s;trunk.castShadow=true;g.add(trunk);for(let i=0;i<4;i++){const crown=new THREE.Mesh(new THREE.ConeGeometry((2.25-i*.18)*s,3.0*s,14),M([0x175b49,0x1c7054,0x2b8660,0x3a9a68][i],.9));crown.position.y=(3.0+i*1.18)*s;crown.castShadow=true;g.add(crown)}world.add(g)}
for(let i=0;i<55;i++){const a=Math.random()*6.28,r=14+Math.random()*48;tree(Math.cos(a)*r,Math.sin(a)*r,.68+Math.random()*1.0)}
function bush(x,z,s){const g=new THREE.Group();g.position.set(x,.1,z);for(let i=0;i<5;i++){const q=new THREE.Mesh(new THREE.IcosahedronGeometry(.55*s,1),M([0x28755a,0x3c9068,0x1d624e][i%3],.95));q.position.set((Math.random()-.5)*s,.35+Math.random()*s*.35,(Math.random()-.5)*s);q.castShadow=true;g.add(q)}world.add(g)}
for(let i=0;i<80;i++){const a=Math.random()*6.28,r=8+Math.random()*58;bush(Math.cos(a)*r,Math.sin(a)*r,.35+Math.random()*.65)}
// ancient ruin / rune shrine
const shrine=new THREE.Group();shrine.position.set(-11,0,-14);world.add(shrine);
for(let i=0;i<6;i++){const p=new THREE.Mesh(new THREE.CylinderGeometry(.75,1.0,6.2,12),M(0x64757a,.72));p.position.set((i-2.5)*2.1,3.1,(i%2)*.8);p.rotation.z=(Math.random()-.5)*.09;p.castShadow=true;shrine.add(p)}
const slab=new THREE.Mesh(new THREE.BoxGeometry(8,1,4.5),M(0x687b7e,.78));slab.position.y=.55;slab.castShadow=true;shrine.add(slab);
const rune=new THREE.Mesh(new THREE.TorusGeometry(2.0,.16,20,64),M(0x6ff2d5,.3,0,0x35d9b1));rune.position.set(0,3.1,1.1);rune.rotation.x=Math.PI/2;shrine.add(rune);const runeGem=new THREE.Mesh(new THREE.OctahedronGeometry(.48),M(0xc6fff2,.18,0,0x55ffcf));runeGem.position.set(0,4.1,1.1);runeGem.castShadow=true;shrine.add(runeGem);const runeLight=new THREE.PointLight(0x4de5c5,28,14);runeLight.position.set(0,4,1);shrine.add(runeLight);
// magical shoe — unique layered artifact
const shoe=new THREE.Group();shoe.position.set(8,2.2,-9);world.add(shoe);
const sole=new THREE.Mesh(new THREE.CapsuleGeometry(1.38,.92,12,28),M(0x40235f,.35,.05));sole.rotation.z=Math.PI/2;sole.scale.z=.58;sole.castShadow=true;shoe.add(sole);
const upper=new THREE.Mesh(new THREE.SphereGeometry(1.18,36,24),M(0xb76ae6,.27,.02,0x35124f));upper.scale.set(1.08,.58,.76);upper.position.y=.57;upper.castShadow=true;shoe.add(upper);
const toe=new THREE.Mesh(new THREE.SphereGeometry(.72,32,20),M(0xe7a6ff,.25,.02,0x421658));toe.scale.set(1.35,.58,.8);toe.position.set(1.0,.48,.08);toe.castShadow=true;shoe.add(toe);
const heel=new THREE.Mesh(new THREE.BoxGeometry(.48,.78,.92),M(0x5e2c8c,.32));heel.position.set(-1.15,.38,.05);heel.castShadow=true;shoe.add(heel);
const tongue=new THREE.Mesh(new THREE.BoxGeometry(.48,.92,.18),M(0xf1c5ff,.28,0,0x6d277e));tongue.position.set(.0,.88,.55);tongue.rotation.x=-.18;shoe.add(tongue);
for(let i=-2;i<=2;i++){const lace=new THREE.Mesh(new THREE.TorusGeometry(.17,.038,8,20),M(0xffe7a2,.22,0,0xffb52f));lace.scale.x=1.6;lace.rotation.x=Math.PI/2;lace.position.set(-.2+i*.22,.88,.72);shoe.add(lace)}
const wingMat=M(0xefd8ff,.2,.05,0x8b4bd5);for(const side of [-1,1]){const w=new THREE.Mesh(new THREE.ConeGeometry(.55,.95,5),wingMat);w.position.set(-.2,1.1,side*.62);w.rotation.set(0,side*.65,side*.45);w.scale.set(.55,1,.7);shoe.add(w)}
const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.34),M(0xffefaa,.16,0,0xff9d1c));gem.position.set(.7,.9,.42);shoe.add(gem);const glow=new THREE.PointLight(0xd37cff,24,11);shoe.add(glow);
const portal=new THREE.Group();portal.position.set(19,3.2,-17);world.add(portal);const pr=new THREE.Mesh(new THREE.TorusGeometry(3.1,.34,24,80),M(0x7df5da,.22,0,0x39e0b9));portal.add(pr);const inner=new THREE.Mesh(new THREE.CircleGeometry(2.72,64),new THREE.MeshBasicMaterial({color:0x153743,transparent:true,opacity:.82}));inner.rotation.y=Math.PI;portal.add(inner);const pLight=new THREE.PointLight(0x57ebcf,42,18);portal.add(pLight);portal.visible=false;
// player
const player=new THREE.Group();player.position.set(0,0,7);world.add(player);let character=null,mixer=null,walkAction=null;
const loader=new GLTFLoader();loader.load('./assets/character.glb',g=>{character=g.scene;character.scale.setScalar(1.7);character.position.y=0;character.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});player.add(character);if(g.animations&&g.animations.length){mixer=new THREE.AnimationMixer(character);const clips=g.animations;walkAction=mixer.clipAction(clips.find(a=>/walk|run|jog/i.test(a.name))||clips[0]);walkAction.play();walkAction.paused=true}},undefined,e=>console.warn('character',e));
// soft fallback while asset loads
const fallback=new THREE.Group();const fbBody=new THREE.Mesh(new THREE.CapsuleGeometry(.48,1.15,8,16),M(0x7449a0,.55));fbBody.position.y=1.3;fallback.add(fbBody);const fbHead=new THREE.Mesh(new THREE.SphereGeometry(.44,24,16),M(0xe8bea0,.82));fbHead.position.y=2.35;fallback.add(fbHead);fallback.visible=true;player.add(fallback);
let stars=0,coins=0,stage=0,started=false;try{const x=JSON.parse(localStorage.getItem('magic_shoe_3d')||'{}');stars=x.stars||0;coins=x.coins||0;stage=x.stage||0}catch(e){}
const $=id=>document.getElementById(id);$('stars').textContent=stars;$('coins').textContent=coins;
function quest(){const q=stage===0?'استكشف الغابة وابحث عن الرمز السحري':stage===1?'اتبع الأثر واعثر على الحذاء السحري':stage===2?'اقترب من البوابة السحرية':'المغامرة الأولى اكتملت — العصا السحرية تنتظرك';$('quest').textContent=q;$('progress').style.width=(stage/3*100)+'%'}quest();
function save(){localStorage.setItem('magic_shoe_3d',JSON.stringify({stars,coins,stage}))}function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
$('start').onclick=()=>{started=true;$('title').classList.add('hide');$('hint').textContent='حرّك الشخصية نحو الرمز الأخضر ثم اضغط تفاعل'};
$('action').onclick=()=>{if(!started)return;if(stage===0&&player.position.distanceTo(shrine.position)<8){stage=1;stars++;coins+=10;toast('✨ وجدت الرمز السحري! اتبع الأثر إلى الحذاء')}else if(stage===1&&player.position.distanceTo(shoe.position)<6){stage=2;stars+=3;coins+=35;toast('👟 الحذاء السحري اختارك! القدرة الجديدة: الخطوة الخفية')}else if(stage===2&&player.position.distanceTo(portal.position)<7){stage=3;stars+=5;coins+=60;portal.visible=true;toast('🪄 البوابة استجابت — الفصل التالي مفتوح')}quest();$('stars').textContent=stars;$('coins').textContent=coins;save()};
const input={x:0,y:0},stick=$('stick');let active=false,pid=null;function setJoy(x,y){const r=stick.getBoundingClientRect();let dx=(x-(r.left+r.width/2))/(r.width*.34),dy=(y-(r.top+r.height/2))/(r.height*.34);const len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}input.x=dx;input.y=dy;stick.style.setProperty('--jx',dx*25+'px');stick.style.setProperty('--jy',dy*25+'px');stick.style.setProperty('--a','1')}function reset(){input.x=input.y=0;stick.style.setProperty('--jx','0px');stick.style.setProperty('--jy','0px');stick.style.setProperty('--a','0');active=false;pid=null}stick.addEventListener('pointerdown',e=>{active=true;pid=e.pointerId;stick.setPointerCapture(pid);setJoy(e.clientX,e.clientY)});stick.addEventListener('pointermove',e=>{if(active&&e.pointerId===pid)setJoy(e.clientX,e.clientY)});stick.addEventListener('pointerup',reset);stick.addEventListener('pointercancel',reset);
let last=performance.now(),camTarget=new THREE.Vector3(),desiredCam=new THREE.Vector3(),clock=new THREE.Clock();
function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}addEventListener('resize',resize);
loading.style.display='none';
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.033);last=now;const t=now*.001;
if(started){const mag=Math.min(1,Math.hypot(input.x,input.y));const speed=5.6;const dx=input.x, dz=input.y;const len=Math.hypot(dx,dz);if(len>.08){const vx=dx/len*speed*mag,vz=dz/len*speed*mag;player.position.x+=vx*dt;player.position.z+=vz*dt;player.position.x=THREE.MathUtils.clamp(player.position.x,-48,48);player.position.z=THREE.MathUtils.clamp(player.position.z,-58,58);const targetRot=Math.atan2(vx,vz);player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,targetRot,.18);if(walkAction)walkAction.paused=false}else if(walkAction)walkAction.paused=true}
if(mixer)mixer.update(dt);shoe.position.y=2.2+Math.sin(t*2.1)*.22;shoe.rotation.y=t*.55;gem.rotation.y=t*2.4;gem.position.y=.9+Math.sin(t*3)*.08;pr.rotation.z=t*.35;pr.rotation.y=Math.sin(t*.7)*.18;inner.material.opacity=.62+Math.sin(t*2)*.12;rune.rotation.z=t*.35;runeGem.rotation.y=t*1.7;runeGem.position.y=4.1+Math.sin(t*2.5)*.18;
camTarget.copy(player.position);camTarget.y+=1.25;const behind=new THREE.Vector3(Math.sin(player.rotation.y)*7.2,4.6,Math.cos(player.rotation.y)*7.2);desiredCam.copy(player.position).add(behind);C.position.lerp(desiredCam,.075);C.lookAt(camTarget);R.render(S,C)}requestAnimationFrame(animate)}requestAnimationFrame(animate);
}catch(e){fail(e)}}).catch(fail);
</script>
</body></html>
