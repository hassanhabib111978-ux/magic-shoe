<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#07111c"><title>الحذاء السحري — المغامرة الأولى</title><style>*{box-sizing:border-box}html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#050b14!important}body{position:fixed!important;inset:0!important;display:block!important}#game{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;display:block!important;touch-action:none;background:#07111c}#v{position:fixed;top:8px;left:8px;z-index:5;padding:4px 8px;border-radius:9px;background:#07111dcc;color:#ffffff66;font:10px system-ui;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="v">MAGIC SHOE • 0.3</div><script>const c=document.getElementById('game'),g=c.getContext('2d');let W,H,S,t=0,drag=null;const st={p:{x:640,y:500},shoe:{x:970,y:270},puz:{x:340,y:340},secret:{x:790,y:420},done:false,has:false,found:false,stars:0,coins:0,msg:'اقترب من الحجر القديم واكتشف أول سر.'},keys={};try{Object.assign(st,JSON.parse(localStorage.getItem('magic_shoe_v3')||'{}'))}catch(e){}function save(){try{localStorage.setItem('magic_shoe_v3',JSON.stringify(st))}catch(e){}}function resize(){W=innerWidth;H=innerHeight;let d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;S=Math.min(W/1280,H/720);g.setTransform(d*S,0,0,d*S,0,0)}addEventListener('resize',resize);resize();function P(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S}}c.onpointerdown=e=>{let p=P(e);if(p.x>1040&&p.y>560){act();return}drag=p};c.onpointermove=e=>{if(!drag)return;let p=P(e),dx=p.x-drag.x,dy=p.y-drag.y;if(Math.hypot(dx,dy)>5){move(dx,dy);drag=p}};c.onpointerup=c.onpointercancel=()=>drag=null;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='Enter'||e.key===' ')act()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);function move(dx,dy){let n=Math.hypot(dx,dy)||1;st.p.x=Math.max(70,Math.min(1210,st.p.x+dx/n*18));st.p.y=Math.max(180,Math.min(575,st.p.y+dy/n*18))}function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function act(){if(!st.done&&d(st.p,st.puz)<135){st.done=true;st.stars++;st.coins+=5;st.msg='انفتح الحجر! الضوء يقودك إلى الحذاء السحري ✦';save();return}if(st.done&&!st.has&&d(st.p,st.shoe)<140){st.has=true;st.stars+=2;st.coins+=15;st.msg='وجدت الحذاء السحري! «الخطوة الخفية» أصبحت متاحة.';save();return}if(st.has&&!st.found&&d(st.p,st.secret)<140){st.found=true;st.stars+=2;st.coins+=20;st.msg='كشفت الطريق السري! مهمة العصا السحرية متاحة.';save();return}st.msg=!st.done?'اقترب من الحجر القديم ثم اضغط تفاعل.':!st.has?'اقترب من الحذاء السحري ثم اضغط تفاعل.':!st.found?'ابحث عن البوابة المضيئة.':'المغامرة الأولى اكتملت — العصا السحرية تنتظرك.'}function txt(v,x,y,z=18,a='left',w=400,o=1){g.save();g.globalAlpha=o;g.font=w+' '+z+'px system-ui';g.textAlign=a;g.fillStyle='#fff';g.fillText(v,x,y);g.restore()}function rr(x,y,w,h,r,f,a=1){g.save();g.globalAlpha=a;g.fillStyle=f;g.beginPath();g.roundRect(x,y,w,h,r);g.fill();g.restore()}function glow(x,y,r,col,a=.2){let q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,col);q.addColorStop(1,'transparent');g.save();g.globalAlpha=a;g.fillStyle=q;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.restore()}function tree(x,y,k){g.fillStyle='#15271f';g.fillRect(x-7,y,14,80*k);for(let i=0;i<3;i++){g.fillStyle=i%2?'#285047':'#1d3b35';g.beginPath();g.arc(x+(i-1)*22,y-i*22,34*k,0,7);g.fill()}}function rune(x,y){g.save();g.translate(x,y);g.strokeStyle='#78ded2';g.lineWidth=4;g.beginPath();g.arc(0,0,40,0,7);g.stroke();g.beginPath();g.moveTo(0,-29);g.lineTo(27,24);g.lineTo(-27,24);g.closePath();g.stroke();g.restore()}function stone(x,y){glow(x,y,135,'#65d7ce',.12);g.fillStyle='#425b6b';g.beginPath();g.moveTo(x-52,y+27);g.lineTo(x-42,y-28);g.lineTo(x-8,y-50);g.lineTo(x+45,y-29);g.lineTo(x+53,y+22);g.lineTo(x+18,y+50);g.lineTo(x-34,y+43);g.closePath();g.fill();g.fillStyle='#172c3c';g.beginPath();g.arc(x,y,34,0,7);g.fill();rune(x,y);txt('✦',x,y+9,25,'center',800);txt('الحجر القديم',x,y+80,16,'center',600,.8)}function shoe(x,y){glow(x,y,170,'#f0c879',.2);g.save();g.translate(x,y);g.rotate(-.1);g.shadowColor='#d69aff';g.shadowBlur=28;g.fillStyle='#7046a2';g.beginPath();g.moveTo(-54,20);g.quadraticCurveTo(-48,-32,-9,-43);g.quadraticCurveTo(30,-47,51,-7);g.lineTo(76,13);g.quadraticCurveTo(75,37,42,40);g.lineTo(-31,39);g.quadraticCurveTo(-64,38,-54,20);g.fill();g.shadowBlur=0;g.fillStyle='#d49be7';g.beginPath();g.moveTo(-31,-31);g.quadraticCurveTo(1,-7,30,-25);g.lineTo(19,-2);g.quadraticCurveTo(-4,8,-34,-12);g.closePath();g.fill();g.fillStyle='#ffe4a0';g.beginPath();g.arc(0,-36,9,0,7);g.fill();g.restore();txt('الحذاء السحري',x,y+84,18,'center',800)}function portal(x,y){glow(x,y,135,'#72e6c1',.2);g.save();g.translate(x,y);g.strokeStyle='#8ff2d0';g.lineWidth=6;g.shadowColor='#64e7bd';g.shadowBlur=25;g.beginPath();g.ellipse(0,0,45,62,0,0,7);g.stroke();g.shadowBlur=0;g.restore();txt('الطريق الخفي',x,y+88,16,'center',700)}function player(x,y){g.save();g.translate(x,y);g.shadowColor='#f5d27a';g.shadowBlur=14;g.fillStyle='#edf2f5';g.beginPath();g.arc(0,-28,15,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#5c3b7d';g.beginPath();g.roundRect(-23,-12,46,49,15);g.fill();g.fillStyle='#f5d27a';g.beginPath();g.arc(22,6,7,0,7);g.fill();g.fillStyle='#251d31';g.fillRect(-16,35,11,18);g.fillRect(5,35,11,18);g.restore()}function draw(){t++;g.save();let sky=g.createLinearGradient(0,0,0,720);sky.addColorStop(0,'#050d20');sky.addColorStop(.5,'#143348');sky.addColorStop(1,'#07151a');g.fillStyle=sky;g.fillRect(0,0,1280,720);g.fillStyle='#f5e7bd';g.globalAlpha=.9;g.beginPath();g.arc(1060,105,36,0,7);g.fill();g.globalAlpha=1;for(let i=0;i<50;i++){g.fillStyle='#e6f2ff';g.globalAlpha=.2+(i%4)*.12;g.fillRect((i*97)%1270,25+(i*43)%220,2,2)}g.globalAlpha=1;g.fillStyle='#0b1c2b';g.beginPath();g.moveTo(0,360);g.lineTo(160,175);g.lineTo(330,330);g.lineTo(520,140);g.lineTo(700,325);g.lineTo(900,155);g.lineTo(1100,315);g.lineTo(1280,190);g.lineTo(1280,500);g.lineTo(0,500);g.fill();g.fillStyle='#173c3b';g.beginPath();g.ellipse(640,455,570,235,0,0,7);g.fill();g.fillStyle='#48423a';g.beginPath();g.moveTo(505,650);g.quadraticCurveTo(565,530,665,435);g.quadraticCurveTo(760,350,880,305);g.lineTo(930,335);g.quadraticCurveTo(805,430,720,520);g.quadraticCurveTo(680,590,660,650);g.fill();for(let i=0;i<14;i++)tree(45+i*94+(i%2)*20,310+(i%3)*42,.7+(i%3)*.1);rr(145,245,140,155,10,'#233c49');for(let i=0;i<5;i++)rr(160+i*25,270,15,110,3,'#3a5663');rr(140,225,150,22,4,'#49626c');for(let i=0;i<24;i++){let a=i*.9+t*.008,r=50+(i%6)*15,px=st.shoe.x+Math.cos(a)*r,py=st.shoe.y+Math.sin(a)*r*.55;g.fillStyle='#ffe19a';g.globalAlpha=.65;g.beginPath();g.arc(px,py,2+(i%2),0,7);g.fill()}g.globalAlpha=1;rr(25,20,1230,105,24,'#06101b',.82);txt('الحذاء السحري',58,62,32,'left',800);txt('المغامرة الأولى',58,91,16,'left',400,.65);rr(875,38,150,56,18,'#182f40');txt('★ '+st.stars,950,74,20,'center',800);rr(1035,38,175,56,18,'#182f40');txt('◈ '+st.coins,1122,74,20,'center',800);rr(850,125,360,108,18,'#07131f',.9);txt('المهمة الحالية',1180,151,14,'right',600,.6);txt(st.found?'العصا السحرية متاحة':st.has?'اعثر على الطريق السري':'اعثر على الحذاء السحري',1180,183,20,'right',800);txt('استكشف • حل • اكتشف',1180,211,13,'right',400,.6);if(!st.done)stone(st.puz.x,st.puz.y);else txt('✓',st.puz.x,st.puz.y+10,32,'center',800);if(!st.has)shoe(st.shoe.x,st.shoe.y);else txt('✓',st.shoe.x,st.shoe.y+10,32,'center',800);if(st.has&&!st.found)portal(st.secret.x,st.secret.y);else if(st.found)txt('✓',st.secret.x,st.secret.y+10,32,'center',800);glow(st.p.x,st.p.y,75,'#ffd77d',.12);player(st.p.x,st.p.y);rr(25,606,1230,82,22,'#050e18',.94);txt(st.msg,640,640,17,'center',600);txt('اسحب الشاشة للحركة',640,668,12,'center',400,.42);[[90,550,'↑'],[90,615,'↓'],[20,582,'←'],[160,582,'→']].forEach(b=>{rr(b[0],b[1],52,52,16,'#193247',.96);txt(b[2],b[0]+26,b[1]+34,23,'center',800)});rr(1060,548,155,68,21,'#68449b',.98);txt('تفاعل',1137,590,20,'center',800);g.restore()}function loop(){if(keys.w||keys.arrowup)move(0,-1);if(keys.s||keys.arrowdown)move(0,1);if(keys.a||keys.arrowleft)move(-1,0);if(keys.d||keys.arrowright)move(1,0);draw();requestAnimationFrame(loop)}loop();</script></body></html>
