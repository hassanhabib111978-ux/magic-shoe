<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#06101c"><title>الحذاء السحري — 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020711;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;color:#fff}body{position:fixed;inset:0}#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;direction:ltr}.brand{padding:9px 14px;border-radius:18px;background:#071423bb;border:1px solid #ffffff20;backdrop-filter:blur(14px);font-weight:900}.stats{display:flex;gap:8px}.pill{padding:9px 13px;border-radius:16px;background:#071423bb;border:1px solid #ffffff18;backdrop-filter:blur(14px);font-weight:800}.quest{position:absolute;top:78px;right:14px;width:min(330px,calc(100vw - 28px));padding:13px 16px;border-radius:18px;background:#071423c9;border:1px solid #ffffff1c;backdrop-filter:blur(16px);text-align:right}.quest b{display:block;color:#f4d58b;font-size:12px;margin-bottom:5px}.quest span{font-weight:800}.hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:18px;background:#06111dcc;border:1px solid #ffffff18;backdrop-filter:blur(12px);font-size:13px;color:#d9e6ef;white-space:nowrap}.action{position:absolute;right:22px;bottom:24px;pointer-events:auto;width:82px;height:82px;border-radius:50%;border:1px solid #ffffff35;background:radial-gradient(circle at 35% 30%,#c992ff,#6841a4 65%,#39255e);box-shadow:0 10px 35px #0008,0 0 30px #a56cff55;color:white;font-size:16px;font-weight:900}.action:active{transform:scale(.94)}.stick{position:absolute;left:22px;bottom:24px;width:126px;height:126px;border-radius:50%;background:#07142399;border:1px solid #ffffff20;pointer-events:auto}.stick:after{content:'';position:absolute;width:52px;height:52px;left:37px;top:37px;border-radius:50%;background:#d8e8f0aa;border:1px solid #fff5;box-shadow:0 4px 15px #0008}.title{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#102b3bdd,#020711f2);transition:opacity .7s}.title.hide{opacity:0;pointer-events:none}.card{text-align:center;padding:28px}.logo{font-size:78px;filter:drop-shadow(0 0 28px #d89aff)}h1{font-size:clamp(32px,8vw,64px);margin:4px 0;font-weight:1000;letter-spacing:-2px}h2{font-size:15px;color:#d6e4ed;font-weight:500;margin:0 0 24px}.start{border:0;padding:15px 34px;border-radius:22px;background:linear-gradient(135deg,#d89aff,#7050c7);color:white;font-size:17px;font-weight:900;box-shadow:0 12px 40px #8f5ee766}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#020711;z-index:5;transition:.5s}.loading.off{opacity:0;pointer-events:none}.load{width:180px;height:5px;background:#172637;border-radius:8px;overflow:hidden;margin:14px auto}.load i{display:block;height:100%;width:60%;background:#c995ff;animation:l 1s infinite}@keyframes l{from{transform:translateX(-180px)}to{transform:translateX(180px)}}@media(max-width:600px){.quest{top:70px}.hint{bottom:18px;font-size:11px}.action{width:72px;height:72px}.stick{width:112px;height:112px}.stick:after{left:31px;top:31px}}</style></head><body><div class="loading" id="loading"><div><div style="text-align:center;font-size:44px">👟</div><div style="text-align:center;font-weight:900">جاري تحميل عالم الحذاء السحري</div><div class="load"><i></i></div></div></div><canvas id="game"></canvas><div id="ui"><div id="top"><div class="brand">👟 الحذاء السحري</div><div class="stats"><div class="pill">★ <span id="stars">0</span></div><div class="pill">◈ <span id="coins">0</span></div></div></div><div class="quest"><b>المهمة الحالية</b><span id="quest">استكشف الغابة وابحث عن الرمز السحري</span></div><div class="hint" id="hint">حرّك الشخصية واستكشف العالم — اقترب من العناصر المضيئة</div><div class="stick" id="stick"></div><button class="action" id="action">تفاعل</button><div class="title" id="title"><div class="card"><div class="logo">👟</div><h1>الحذاء السحري</h1><h2>مغامرة ثلاثية الأبعاد — الفصل الأول</h2><button class="start" id="start">ابدأ المغامرة</button></div></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';
const canvas=document.getElementById('game');const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x06111e);scene.fog=new THREE.FogExp2(0x0a2630,.018);const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,500);camera.position.set(0,5.5,11);
const hemi=new THREE.HemisphereLight(0x9edbff,0x10241b,1.6);scene.add(hemi);const moon=new THREE.DirectionalLight(0xc7dfff,3.1);moon.position.set(-12,18,8);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);moon.shadow.camera.left=-35;moon.shadow.camera.right=35;moon.shadow.camera.top=35;moon.shadow.camera.bottom=-35;scene.add(moon);const purple=new THREE.PointLight(0xc987ff,25,18);purple.position.set(8,5,-5);scene.add(purple);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.55,.65,.72);composer.addPass(bloom);
const world=new THREE.Group();scene.add(world);const mat=(c,r=0.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const ground=new THREE.Mesh(new THREE.CircleGeometry(90,96),mat(0x173d35,1));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;world.add(ground);const pathMat=mat(0x5b5549,1);const path=new THREE.Mesh(new THREE.CapsuleGeometry(3,34,8,24),pathMat);path.rotation.x=Math.PI/2;path.position.set(0,.03,0);world.add(path);
function rock(x,z,s){const m=new THREE.Mesh(new THREE.DodecahedronGeometry(s,1),mat(0x38535c));m.position.set(x,s*.45,z);m.scale.y=.55;m.castShadow=true;m.receiveShadow=true;world.add(m)}
for(let i=0;i<35;i++){let a=Math.random()*Math.PI*2,r=13+Math.random()*45;rock(Math.cos(a)*r,Math.sin(a)*r,.5+Math.random()*1.8)}
function tree(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25*s,.38*s,3.2*s,8),mat(0x4b3227));trunk.position.y=1.6*s;trunk.castShadow=true;g.add(trunk);for(let i=0;i<4;i++){const crown=new THREE.Mesh(new THREE.ConeGeometry((2.1-i*.25)*s,3.5*s,9),mat(i%2?0x17604c:0x21745b));crown.position.y=(3+i*1.25)*s;crown.position.x=(i%2-.5)*.5*s;crown.castShadow=true;g.add(crown)}world.add(g)}
for(let i=0;i<38;i++){let a=Math.random()*Math.PI*2,r=15+Math.random()*42;tree(Math.cos(a)*r,Math.sin(a)*r,.65+Math.random()*1.1)}
function ruin(){const g=new THREE.Group();g.position.set(-11,0,-10);for(let i=0;i<5;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(1.7,7,1.7),mat(0x50616a));p.position.set((i-2)*2.2,3.5,0);p.rotation.z=(i-2)*.05;p.castShadow=true;g.add(p)}const top=new THREE.Mesh(new THREE.BoxGeometry(12,1,2),mat(0x65757a));top.position.y=7;top.castShadow=true;g.add(top);const rune=new THREE.Mesh(new THREE.TorusGeometry(1.4,.08,12,64),new THREE.MeshStandardMaterial({color:0x7ef2d1,emissive:0x38d8bd,emissiveIntensity:5}));rune.position.set(0,3.5,1);g.add(rune);world.add(g)}ruin();
function shoe(){const g=new THREE.Group();g.position.set(8,2.5,-8);g.rotation.y=-.5;const sole=new THREE.Mesh(new THREE.CapsuleGeometry(1.05,.9,8,20),mat(0x6f3f9d,.45));sole.rotation.z=Math.PI/2;sole.scale.set(1,1,.62);sole.castShadow=true;g.add(sole);const upper=new THREE.Mesh(new THREE.SphereGeometry(1.0,32,16),mat(0xb36bdd,.35));upper.scale.set(1.1,.55,.7);upper.position.set(-.1,.65,0);upper.castShadow=true;g.add(upper);const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.28),new THREE.MeshStandardMaterial({color:0xffe5a0,emissive:0xffb84d,emissiveIntensity:6}));gem.position.set(-.2,1.05,.1);g.add(gem);const light=new THREE.PointLight(0xd58aff,16,8);g.add(light);world.add(g);return g}const magicShoe=shoe();
function portal(){const g=new THREE.Group();g.position.set(18,3,-14);const ring=new THREE.Mesh(new THREE.TorusGeometry(2.4,.28,24,64),new THREE.MeshStandardMaterial({color:0x75f0cf,emissive:0x48e6c1,emissiveIntensity:7,transparent:true,opacity:.95}));ring.rotation.x=.1;g.add(ring);const core=new THREE.Mesh(new THREE.CircleGeometry(2.15,64),new THREE.MeshBasicMaterial({color:0x6be8d0,transparent:true,opacity:.18,side:THREE.DoubleSide}));g.add(core);const light=new THREE.PointLight(0x63e7c8,30,15);g.add(light);world.add(g);return g}const magicPortal=portal();magicPortal.visible=false;
function hero(){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.3,8,16),mat(0x56377d,.55));body.position.y=1.45;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.48,24,16),mat(0xe9c4a5,.8));head.position.y=2.55;head.castShadow=true;g.add(head);const hood=new THREE.Mesh(new THREE.ConeGeometry(.7,.9,16),mat(0x382653,.8));hood.position.y=2.9;hood.castShadow=true;g.add(hood);for(const sx of[-.22,.22]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.75,6,10),mat(0x201b2c));leg.position.set(sx,0.48,0);leg.castShadow=true;g.add(leg)}const aura=new THREE.PointLight(0xf0cf83,2,4);aura.position.y=1.5;g.add(aura);return g}const player=hero();player.position.set(0,0,7);world.add(player);
const starGeo=new THREE.BufferGeometry();const verts=[];for(let i=0;i<500;i++)verts.push((Math.random()-.5)*180,25+Math.random()*45,(Math.random()-.5)*180);starGeo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xd8efff,size:.16,transparent:true,opacity:.75})));
const fireflies=[];for(let i=0;i<70;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),new THREE.MeshBasicMaterial({color:0x9effdf}));m.position.set((Math.random()-.5)*60,.5+Math.random()*8,(Math.random()-.5)*55);scene.add(m);fireflies.push({m,p:Math.random()*6.28});}
let stars=0,coins=0,stage=0,started=false;try{const s=JSON.parse(localStorage.getItem('magic_shoe_3d')||'{}');stars=s.stars||0;coins=s.coins||0;stage=s.stage||0}catch(e){}function save(){localStorage.setItem('magic_shoe_3d',JSON.stringify({stars,coins,stage}))}function refresh(){document.getElementById('stars').textContent=stars;document.getElementById('coins').textContent=coins;document.getElementById('quest').textContent=stage===0?'استكشف الغابة وابحث عن الرمز السحري':stage===1?'اتبع الأثر واعثر على الحذاء السحري':stage===2?'اقترب من البوابة السحرية':'المغامرة الأولى اكتملت — العصا السحرية تنتظرك';}refresh();
let target=new THREE.Vector3();const input={x:0,y:0};const stick=document.getElementById('stick');function setInput(cx,cy){const r=stick.getBoundingClientRect();input.x=Math.max(-1,Math.min(1,(cx-(r.left+r.width/2))/(r.width*.38)));input.y=Math.max(-1,Math.min(1,(cy-(r.top+r.height/2))/(r.height*.38)));stick.style.setProperty('--x',input.x);stick.style.setProperty('--y',input.y)}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);setInput(e.clientX,e.clientY)});stick.addEventListener('pointermove',e=>{if(e.buttons)setInput(e.clientX,e.clientY)});stick.addEventListener('pointerup',()=>{input.x=input.y=0});stick.addEventListener('pointercancel',()=>{input.x=input.y=0});const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function interact(){if(!started)return;if(stage===0&&player.position.distanceTo(new THREE.Vector3(-11,0,-10))<8){stage=1;stars++;coins+=10;save();refresh();toast('اكتشفت الرمز القديم! اتبع الأثر البنفسجي.');}else if(stage===1&&player.position.distanceTo(magicShoe.position)<5){stage=2;stars+=3;coins+=35;save();refresh();toast('الحذاء السحري أصبح لك — قدرة الخطوة الخفية فُتحت!');}else if(stage===2&&player.position.distanceTo(magicPortal.position)<6){stage=3;stars+=5;coins+=60;save();refresh();toast('البوابة استجابت! الفصل التالي: العصا السحرية.');}}
document.getElementById('action').onclick=interact;document.getElementById('start').onclick=()=>{started=true;document.getElementById('title').classList.add('hide');};function toast(s){document.getElementById('hint').textContent=s;setTimeout(()=>document.getElementById('hint').textContent='حرّك الشخصية واستكشف العالم — اقترب من العناصر المضيئة',3200)}
function update(dt){if(!started)return;let ix=input.x,iy=input.y;if(keys.w||keys.arrowup)iy=-1;if(keys.s||keys.arrowdown)iy=1;if(keys.a||keys.arrowleft)ix=-1;if(keys.d||keys.arrowright)ix=1;const v=new THREE.Vector3(ix,0,iy);if(v.lengthSq()>0){v.normalize();player.position.addScaledVector(v,dt*6);player.rotation.y=Math.atan2(v.x,v.z);player.position.x=THREE.MathUtils.clamp(player.position.x,-28,28);player.position.z=THREE.MathUtils.clamp(player.position.z,-28,28)}magicShoe.position.y=2.5+Math.sin(performance.now()*.002)*.25;magicShoe.rotation.y+=dt*.5;magicPortal.rotation.y+=dt*.4;magicPortal.visible=stage>=2;for(const f of fireflies){f.m.position.y+=Math.sin(performance.now()*.001+f.p)*dt*.3}target.set(player.position.x,4.2,player.position.z+10);camera.position.lerp(target,.07);camera.lookAt(player.position.x,1.6,player.position.z);}
let prev=performance.now();function loop(now){const dt=Math.min(.033,(now-prev)/1000);prev=now;update(dt);composer.render();requestAnimationFrame(loop)}resize();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});setTimeout(()=>document.getElementById('loading').classList.add('off'),700);loop(performance.now());</script></body></html>
