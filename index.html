<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>الحذاء السحري — المغامرة الأولى</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}body{display:flex;align-items:center;justify-content:center}canvas{width:100vw;height:100vh;display:block;touch-action:none}#hint{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);font-size:10px;opacity:.35;pointer-events:none;white-space:nowrap}</style></head><body><canvas id="game"></canvas><div id="hint">اسحب للتحرك • اقترب من الهدف • اضغط تفاعل</div><script>
const c=document.getElementById('game'),g=c.getContext('2d');let W,H,S,t=0;const SAVE='magic_shoe_adventure_v2';const st={p:{x:640,y:515},shoe:{x:980,y:280},puz:{x:340,y:360},secret:{x:790,y:425},done:false,has:false,found:false,stars:0,coins:0,msg:'الأثر يبدأ من حجر اللغز...'};const keys={};try{Object.assign(st,JSON.parse(localStorage.getItem(SAVE)||'{}'))}catch(e){}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(st))}catch(e){}}function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);S=Math.min(W/1280,H/720)}addEventListener('resize',resize);resize();function P(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S}}let drag=null;c.onpointerdown=e=>{let p=P(e);if(p.x>1060&&p.y>540){interact();return}drag=p};c.onpointermove=e=>{if(!drag)return;let p=P(e),dx=p.x-drag.x,dy=p.y-drag.y;if(Math.hypot(dx,dy)>6){move(dx,dy);drag=p}};c.onpointerup=c.onpointercancel=()=>drag=null;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='Enter'||e.key===' ')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);function move(dx,dy){let n=Math.hypot(dx,dy)||1;st.p.x=Math.max(85,Math.min(1195,st.p.x+dx/n*18));st.p.y=Math.max(185,Math.min(555,st.p.y+dy/n*18))}function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function interact(){if(!st.done&&d(st.p,st.puz)<135){st.done=true;st.stars++;st.coins+=5;st.msg='انفتح الحجر... والضوء يقودك إلى الحذاء السحري ✦';save();return}if(st.done&&!st.has&&d(st.p,st.shoe)<135){st.has=true;st.stars+=2;st.coins+=15;st.msg='وجدت الحذاء السحري! «الخطوة الخفية» أصبحت لك.';save();return}if(st.has&&!st.found&&d(st.p,st.secret)<135){st.found=true;st.stars+=2;st.coins+=20;st.msg='كشفت الطريق السري! مهمة العصا السحرية متاحة.';save();return}st.msg=!st.done?'اقترب من حجر اللغز واضغط تفاعل.':!st.has?'اقترب من الحذاء السحري واضغط تفاعل.':!st.found?'ابحث عن الوميض الأخضر في الطريق.':'المغامرة الأولى اكتملت ✦'}
function font(z,w=400){g.font=w+' '+z+'px system-ui,-apple-system,"Segoe UI",sans-serif'}function txt(v,x,y,z=18,a='left',w=400,al=1){g.save();g.globalAlpha=al;font(z,w);g.textAlign=a;g.fillStyle='#fff';g.fillText(v,x,y);g.restore()}function rr(x,y,w,h,r,fill,a=1){g.save();g.globalAlpha=a;g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill();g.restore()}function glow(x,y,r,col,a=.2){let q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,col);q.addColorStop(1,'transparent');g.save();g.globalAlpha=a;g.fillStyle=q;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.restore()}
function tree(x,y,k=1){g.fillStyle='#17251f';g.fillRect(x-7,y,14,80*k);for(let i=0;i<4;i++){g.fillStyle=i%2?'#21483e':'#193a35';g.beginPath();g.arc(x+(i%2?16:-16),y-8-i*17,30*k,0,7);g.fill()}g.fillStyle='#9cc49c';g.globalAlpha=.18;g.beginPath();g.arc(x-13,y-46,5,0,7);g.fill();g.globalAlpha=1}
function rune(x,y){g.save();g.translate(x,y);g.strokeStyle='#78d8d0';g.lineWidth=2;g.globalAlpha=.55;g.beginPath();g.arc(0,0,38,0,7);g.stroke();for(let i=0;i<6;i++){let a=i*Math.PI/3;g.beginPath();g.moveTo(Math.cos(a)*25,Math.sin(a)*25);g.lineTo(Math.cos(a+.35)*34,Math.sin(a+.35)*34);g.stroke()}g.restore()}
function stone(p){g.save();g.translate(p.x,p.y);g.shadowBlur=18;g.shadowColor='#58d0c5';g.fillStyle='#40596b';g.beginPath();g.moveTo(-52,27);g.lineTo(-42,-28);g.lineTo(-8,-51);g.lineTo(45,-29);g.lineTo(53,22);g.lineTo(18,50);g.lineTo(-34,43);g.closePath();g.fill();g.shadowBlur=0;g.fillStyle='#172b3b';g.beginPath();g.arc(0,0,34,0,7);g.fill();rune(0,0);txt('✦',0,9,25,'center',800);g.restore();txt('حجر اللغز',p.x,p.y+78,16,'center',600,.85)}
function shoe(x,y){g.save();g.translate(x,y);g.rotate(-.12);g.shadowBlur=30;g.shadowColor='#d89cff';g.fillStyle='#7046a2';g.beginPath();g.moveTo(-54,20);g.quadraticCurveTo(-48,-30,-9,-43);g.quadraticCurveTo(30,-47,51,-7);g.lineTo(76,13);g.quadraticCurveTo(75,37,42,40);g.lineTo(-31,39);g.quadraticCurveTo(-64,38,-54,20);g.fill();g.shadowBlur=0;g.fillStyle='#c88be1';g.beginPath();g.moveTo(-31,-31);g.quadraticCurveTo(1,-7,30,-25);g.lineTo(19,-2);g.quadraticCurveTo(-4,8,-34,-12);g.closePath();g.fill();g.fillStyle='#ffe6a3';g.beginPath();g.arc(0,-36,9,0,7);g.fill();g.restore();txt('الحذاء السحري',x,y+86,18,'center',700);}
function portal(x,y){glow(x,y,120,'#72e2bd',.2);g.save();g.translate(x,y);g.strokeStyle='#74e0bd';g.lineWidth=4;g.globalAlpha=.7;g.beginPath();g.arc(0,0,48,-1.1,1.1);g.stroke();g.strokeStyle='#d8ffe8';g.lineWidth=2;g.beginPath();g.arc(0,0,36,-1.1,1.1);g.stroke();for(let i=0;i<8;i++){let a=-1+i*.28;g.fillStyle='#a9ffe0';g.beginPath();g.arc(Math.cos(a)*55,Math.sin(a)*55,2.5,0,7);g.fill()}g.restore();txt('طريق خفي',x,y+78,16,'center',600,.9)}
function player(x,y){g.save();g.translate(x,y);g.shadowBlur=15;g.shadowColor='#f3c96e';g.fillStyle='#e9eef2';g.beginPath();g.arc(0,-28,15,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#563879';g.beginPath();g.roundRect(-24,-12,48,50,16);g.fill();g.fillStyle='#f0c56f';g.beginPath();g.arc(20,5,7,0,7);g.fill();g.fillStyle='#30243d';g.fillRect(-15,36,10,18);g.fillRect(5,36,10,18);g.restore()}
function draw(){t++;g.save();g.scale(S,S);let sky=g.createLinearGradient(0,0,0,720);sky.addColorStop(0,'#061326');sky.addColorStop(.45,'#173449');sky.addColorStop(1,'#09151e');g.fillStyle=sky;g.fillRect(0,0,1280,720);glow(960,245,260,'#f5d17c',.1);glow(510,300,330,'#5e9fc0',.07);
// moon and stars
g.fillStyle='#f5e7bb';g.globalAlpha=.85;g.beginPath();g.arc(1080,105,34,0,7);g.fill();g.globalAlpha=1;for(let i=0;i<42;i++){let px=(i*97)%1260+10,py=(i*47)%205+25;g.fillStyle='#dceeff';g.globalAlpha=.25+(i%3)*.18;g.fillRect(px,py,2,2)}g.globalAlpha=1;

function m(points,fill){g.fillStyle=fill;g.beginPath();g.moveTo(0,390);points.forEach(p=>g.lineTo(p[0],p[1]));g.lineTo(1280,500);g.lineTo(0,500);g.closePath();g.fill()}m([[0,330],[170,175],[330,330],[510,145],[700,325],[900,155],[1100,315],[1280,190]],'#0b1c2b');m([[0,390],[220,250],[390,365],[620,220],[830,360],[1050,245],[1280,350]],'#102839');
// clearing
let gr=g.createRadialGradient(640,420,50,640,420,570);gr.addColorStop(0,'#234b4b');gr.addColorStop(1,'#0b2028');g.fillStyle=gr;g.beginPath();g.ellipse(640,450,565,235,0,0,7);g.fill();
// path
g.fillStyle='#3b3936';g.beginPath();g.moveTo(510,620);g.quadraticCurveTo(570,510,665,420);g.quadraticCurveTo(760,345,875,300);g.lineTo(920,330);g.quadraticCurveTo(800,420,720,515);g.quadraticCurveTo(680,570,660,630);g.closePath();g.fill();g.fillStyle='#655d51';g.globalAlpha=.3;for(let i=0;i<13;i++){g.beginPath();g.ellipse(560+i*25,570-(i%4)*35,14,5,0,0,7);g.fill()}g.globalAlpha=1;
for(let i=0;i<12;i++)tree(65+i*108+(i%2)*22,300+(i%3)*45,.72+(i%3)*.08);

g.fillStyle='#253b48';g.fillRect(155,245,125,150);g.fillStyle='#3a5260';for(let i=0;i<5;i++)g.fillRect(165+i*23,270,15,110);g.fillStyle='#49606b';g.fillRect(145,230,145,22);g.fillRect(176,210,84,20);g.fillStyle='#182b37';g.fillRect(195,315,45,80);

for(let i=0;i<24;i++){let a=i*.9+t*.008,rad=45+(i%7)*16,px=st.shoe.x+Math.cos(a)*rad,py=st.shoe.y+Math.sin(a)*rad*.55;glow(px,py,12,'#ffe29a',.12);g.fillStyle='#ffe29a';g.globalAlpha=.65;g.beginPath();g.arc(px,py,1.5+(i%2),0,7);g.fill()}g.globalAlpha=1;

rr(25,20,1230,105,24,'#06101b',.78);txt('الحذاء السحري',58,62,32,'left',800);txt('المغامرة الأولى',58,92,16,'left',400,.65);rr(880,37,150,56,18,'#172d3e',.95);txt('★ '+st.stars,955,73,20,'center',800);rr(1040,37,170,56,18,'#172d3e',.95);txt('◈ '+st.coins,1125,73,20,'center',800);

rr(855,112,355,112,18,'#07131f',.9);txt('المهمة الحالية',1180,140,14,'right',600,.65);txt(st.found?'العصا السحرية متاحة':st.has?'اعثر على الطريق السري':'اعثر على الحذاء السحري',1180,173,20,'right',800);txt(st.found?'اكتملت المغامرة الأولى ✓':'استكشف، حلّ، واكتشف',1180,201,13,'right',400,.6);
if(!st.done){glow(st.puz.x,st.puz.y,140,'#71d8d0',.09);stone(st.puz)}else{rune(st.puz.x,st.puz.y);txt('✓',st.puz.x,st.puz.y+8,30,'center',800)}if(!st.has){shoe(st.shoe.x,st.shoe.y)}else txt('✓',st.shoe.x,st.shoe.y+10,32,'center',800);if(st.has&&!st.found)portal(st.secret.x,st.secret.y);else if(st.found)txt('✓',st.secret.x,st.secret.y+10,32,'center',800);
glow(st.p.x,st.p.y,75,'#ffd77d',.11);player(st.p.x,st.p.y);

rr(25,606,1230,82,22,'#050e18',.94);txt(st.msg,640,639,17,'center',600);txt('اسحب الشاشة للحركة',640,668,12,'center',400,.42);

[[90,550,'↑'],[90,615,'↓'],[20,582,'←'],[160,582,'→']].forEach(b=>{rr(b[0],b[1],52,52,16,'#193247',.96);txt(b[2],b[0]+26,b[1]+34,23,'center',800)});rr(1060,548,155,68,21,'#68449b',.98);txt('تفاعل',1137,590,20,'center',800);g.restore()}
function loop(){if(keys.w||keys.arrowup)move(0,-1);if(keys.s||keys.arrowdown)move(0,1);if(keys.a||keys.arrowleft)move(-1,0);if(keys.d||keys.arrowright)move(1,0);draw();requestAnimationFrame(loop)}loop();</script></body></html>
