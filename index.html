<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#06101c"><title>الحذاء السحري — 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020711;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif}body{position:fixed;inset:0}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#020711;transition:opacity .45s}.loading.off{opacity:0;pointer-events:none}.load{text-align:center;font-weight:900}.bar{width:180px;height:5px;background:#172637;border-radius:8px;overflow:hidden;margin:14px auto}.bar i{display:block;width:55%;height:100%;background:#c995ff;animation:l 1s infinite}@keyframes l{from{transform:translateX(-180px)}to{transform:translateX(180px)}}#ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;direction:ltr}.pill,.quest,.hint{background:#071423cc;border:1px solid #ffffff1c;backdrop-filter:blur(12px)}.pill{padding:9px 13px;border-radius:16px;font-weight:800}.stats{display:flex;gap:8px}.brand{padding:9px 14px;border-radius:18px;background:#071423cc;font-weight:900}.quest{position:absolute;top:70px;right:14px;width:min(330px,calc(100vw - 28px));padding:13px 16px;border-radius:18px;text-align:right}.quest b{display:block;color:#f4d58b;font-size:12px;margin-bottom:5px}.quest span{font-weight:800}.hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:18px;font-size:12px;white-space:nowrap}.action{position:absolute;right:22px;bottom:24px;pointer-events:auto;width:76px;height:76px;border-radius:50%;border:1px solid #ffffff35;background:linear-gradient(135deg,#d89aff,#6544a5);color:#fff;font-weight:900;box-shadow:0 0 30px #a56cff55}.stick{position:absolute;left:22px;bottom:24px;width:112px;height:112px;border-radius:50%;background:#07142399;border:1px solid #ffffff20;pointer-events:auto}.stick:after{content:'';position:absolute;width:50px;height:50px;left:30px;top:30px;border-radius:50%;background:#d8e8f0aa;border:1px solid #fff5}.title{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#102b3ddd,#020711f2);pointer-events:auto;transition:opacity .6s}.title.hide{opacity:0;pointer-events:none}.card{text-align:center;padding:28px}.logo{font-size:76px;filter:drop-shadow(0 0 25px #d89aff)}h1{font-size:clamp(32px,8vw,60px);margin:4px 0;font-weight:1000}h2{font-size:15px;color:#d6e4ed;margin:0 0 24px}.start{border:0;padding:15px 34px;border-radius:22px;background:linear-gradient(135deg,#d89aff,#7050c7);color:#fff;font-size:17px;font-weight:900}</style></head><body><div class="loading" id="loading"><div class="load"><div style="font-size:44px">👟</div><div>جاري تحميل عالم الحذاء السحري</div><div class="bar"><i></i></div></div></div><canvas id="game"></canvas><div id="ui"><div class="top"><div class="brand">👟 الحذاء السحري</div><div class="stats"><div class="pill">★ <span id="stars">0</span></div><div class="pill">◈ <span id="coins">0</span></div></div></div><div class="quest"><b>المهمة الحالية</b><span id="quest">استكشف الغابة وابحث عن الرمز السحري</span></div><div class="hint" id="hint">حرّك الشخصية واستكشف العالم</div><div class="stick" id="stick"></div><button class="action" id="action">تفاعل</button><div class="title" id="title"><div class="card"><div class="logo">👟</div><h1>الحذاء السحري</h1><h2>مغامرة ثلاثية الأبعاد — الفصل الأول</h2><button class="start" id="start">ابدأ المغامرة</button></div></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';
const $=id=>document.getElementById(id),canvas=$('game'),loading=$('loading');try{const R=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.shadowMap.enabled=true;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.15;const S=new THREE.Scene();S.background=new THREE.Color(0x06111e);S.fog=new THREE.FogExp2(0x0a2630,.018);const C=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,500);C.position.set(0,5.5,11);S.add(new THREE.HemisphereLight(0x9edbff,0x10241b,1.7));const sun=new THREE.DirectionalLight(0xc7dfff,3);sun.position.set(-12,18,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);S.add(sun);const glow=new THREE.PointLight(0xc987ff,25,18);glow.position.set(8,5,-5);S.add(glow);const P=new EffectComposer(R);P.addPass(new RenderPass(S,C));P.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.5,.65,.72));const W=new THREE.Group();S.add(W);const M=(c,r=.8,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,emissive:e});const G=new THREE.Mesh(new THREE.CircleGeometry(90,96),M(0x173d35,1));G.rotation.x=-Math.PI/2;G.receiveShadow=true;W.add(G);const path=new THREE.Mesh(new THREE.CapsuleGeometry(3,34,8,24),M(0x5b5549,1));path.rotation.x=Math.PI/2;path.position.y=.03;W.add(path);function tree(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);const t=new THREE.Mesh(new THREE.CylinderGeometry(.25*s,.38*s,3.2*s,8),M(0x4b3227));t.position.y=1.6*s;t.castShadow=true;g.add(t);for(let i=0;i<4;i++){const c=new THREE.Mesh(new THREE.ConeGeometry((2.1-i*.25)*s,3.5*s,9),M(i%2?0x17604c:0x21745b));c.position.y=(3+i*1.25)*s;c.castShadow=true;g.add(c)}W.add(g)}for(let i=0;i<32;i++){const a=Math.random()*6.28,r=14+Math.random()*40;tree(Math.cos(a)*r,Math.sin(a)*r,.7+Math.random())}const ruin=new THREE.Group();ruin.position.set(-11,0,-10);for(let i=0;i<5;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(1.7,7,1.7),M(0x50616a));p.position.set((i-2)*2.2,3.5,0);p.castShadow=true;ruin.add(p)}const rune=new THREE.Mesh(new THREE.TorusGeometry(1.4,.09,12,64),M(0x7ef2d1,.5,0x38d8bd));rune.position.set(0,3.5,1);ruin.add(rune);W.add(ruin);function shoe(){const g=new THREE.Group();g.position.set(8,2.5,-8);const a=new THREE.Mesh(new THREE.CapsuleGeometry(1.05,.9,8,20),M(0x6f3f9d,.45));a.rotation.z=Math.PI/2;a.scale.z=.62;g.add(a);const b=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),M(0xb36bdd,.35));b.scale.set(1.1,.55,.7);b.position.y=.65;g.add(b);const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.28),M(0xffe5a0,.3,0xff9b28));gem.position.set(-.2,1.05,.1);g.add(gem);g.add(new THREE.PointLight(0xd58aff,16,8));W.add(g);return g}const shoe=shoe();const portal=new THREE.Group();portal.position.set(18,3,-14);const ring=new THREE.Mesh(new THREE.TorusGeometry(2.4,.28,24,64),M(0x75f0cf,.35,0x48e6c1));portal.add(ring);portal.add(new THREE.PointLight(0x63e7c8,30,15));portal.visible=false;W.add(portal);function hero(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.3,8,16),M(0x56377d,.55));b.position.y=1.45;g.add(b);const h=new THREE.Mesh(new THREE.SphereGeometry(.48,24,16),M(0xe9c4a5,.8));h.position.y=2.55;g.add(h);const hood=new THREE.Mesh(new THREE.ConeGeometry(.7,.9,16),M(0x382653,.8));hood.position.y=2.9;g.add(hood);for(const x of[-.22,.22]){const l=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.75,6,10),M(0x201b2c));l.position.set(x,.48,0);g.add(l)}return g}const player=hero();player.position.set(0,0,7);W.add(player);const starsGeo=new THREE.BufferGeometry(),v=[];for(let i=0;i<500;i++)v.push((Math.random()-.5)*180,25+Math.random()*45,(Math.random()-.5)*180);starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(v,3));S.add(new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0xd8efff,size:.16,transparent:true,opacity:.75})));let stars=0,coins=0,stage=0,started=false;try{const x=JSON.parse(localStorage.getItem('magic_shoe_3d')||'{}');stars=x.stars||0;coins=x.coins||0;stage=x.stage||0}catch(e){}$('stars').textContent=stars;$('coins').textContent=coins;function quest(){ $('quest').textContent=stage===0?'استكشف الغابة وابحث عن الرمز السحري':stage===1?'اتبع الأثر واعثر على الحذاء السحري':stage===2?'اقترب من البوابة السحرية':'المغامرة الأولى اكتملت — العصا السحرية تنتظرك'}quest();function save(){localStorage.setItem('magic_shoe_3d',JSON.stringify({stars,coins,stage}))}function interact(){if(!started)return;if(stage===0&&player.position.distanceTo(ruin.position)<8){stage=1;stars++;coins+=10}else if(stage===1&&player.position.distanceTo(shoe.position)<5){stage=2;stars+=3;coins+=35}else if(stage===2&&player.position.distanceTo(portal.position)<6){stage=3;stars+=5;coins+=60}quest();$('stars').textContent=stars;$('coins').textContent=coins;save()}$('action').onclick=interact;$('start').onclick=()=>{started=true;$('title').classList.add('hide')};const input={x:0,y:0},stick=$('stick');function joy(x,y){const r=stick.getBoundingClientRect();input.x=Math.max(-1,Math.min(1,(x-r.left-r.width/2)/(r.width*.38)));input.y=Math.max(-1,Math.min(1,(y-r.top-r.height/2)/(r.height*.38)))}stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);joy(e.clientX,e.clientY)};stick.onpointermove=e=>{if(e.buttons)joy(e.clientX,e.clientY)};stick.onpointerup=stick.onpointercancel=()=>{input.x=input.y=0};function resize(){C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);P.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();function loop(t){const dt=.016;shoe.position.y=2.5+Math.sin(t*.002)*.25;shoe.rotation.y+=dt*.5;portal.rotation.y+=dt*.4;if(started){const q=new THREE.Vector3(input.x,0,input.y);if(q.lengthSq()){q.normalize();player.position.addScaledVector(q,dt*6);player.rotation.y=Math.atan2(q.x,q.z)}}C.position.lerp(new THREE.Vector3(player.position.x,4.2,player.position.z+10),.07);C.lookAt(player.position.x,1.5,player.position.z);portal.visible=stage>=2;P.render();requestAnimationFrame(loop)}requestAnimationFrame(loop);setTimeout(()=>loading.classList.add('off'),500)}catch(e){console.error(e);loading.innerHTML='<div style="text-align:center;padding:24px"><div style="font-size:42px">⚠️</div><b>تعذر تشغيل النسخة الحالية</b><br><small>أعد فتح الصفحة بعد لحظات</small></div>'}</script></body></html>
