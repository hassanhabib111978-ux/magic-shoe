# Deploy the Magic Shoe web game to GitHub Pages
name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Three.js locally
        run: |
          mkdir -p vendor
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js -o vendor/three.module.js
          test -s vendor/three.module.js
      - name: Prepare final entry page
        run: |
          cp game.html index.html
          # Fix the source's invalid nested catch before deployment.
          sed -i 's/}catch(e){throw e}//' index.html
          # Keep the directional light construction valid.
          sed -i "s#scene.add(new THREE.DirectionalLight(0x779cff,.55).position.set(30,18,-30));#const moon=new THREE.DirectionalLight(0x779cff,.55);moon.position.set(30,18,-30);scene.add(moon);#" index.html
          # Aim the camera into the game world; the default camera looks horizontally and can miss the ground/world.
          sed -i 's#camera.position.set(0,6,11);#camera.position.set(0,6,11);camera.lookAt(0,1,-8);#' index.html
          # Expose Three.js and the hero shoe to the visual enhancement script.
          sed -i 's#const THREE=await import('\''./vendor/three.module.js'\'');#const THREE=await import('\''./vendor/three.module.js'\'');window.__MAGIC_THREE=THREE;#' index.html
          sed -i 's#const shoe=new THREE.Group();shoe.position#const shoe=new THREE.Group();window.__magicShoe=shoe;shoe.position#' index.html
          # Add a clear WebGL2/runtime diagnostic instead of a mysterious black screen.
          sed -i 's#<script type="module">#<script>(function(){function show(msg){var x=document.getElementById("loading");if(x)x.innerHTML="<div id=\"err\"><div style=\"font-size:55px\">⚠️</div><b>تشخيص تشغيل اللعبة</b><br>"+msg+"<br><br><button class=\"btn\" onclick=\"location.reload()\">إعادة المحاولة</button></div>";if(x)x.style.display="grid"}window.addEventListener("error",function(){show("حدث خطأ أثناء تشغيل المشهد. الهاتف ليس بالضرورة غير قادر على تشغيل 3D.")});window.addEventListener("unhandledrejection",function(){show("حدث خطأ أثناء تشغيل المشهد. الهاتف ليس بالضرورة غير قادر على تشغيل 3D.")});var p=document.createElement("canvas"),gl=null;try{gl=p.getContext("webgl2")}catch(e){}if(!gl)show("هذا المتصفح لا يوفر WebGL 2 حالياً. جرّب Chrome أو تحديث المتصفح.")})();</script><script type="module">#' index.html
          sed -i 's#</body>#<script src="./shoe_visual.js"></script></body>#' index.html
          grep -q "window.__MAGIC_THREE=THREE" index.html
          grep -q "window.__magicShoe=shoe" index.html
          grep -q "shoe_visual.js" index.html
          grep -q 'id="loading"' index.html
          ! grep -q 'catch(e){throw e}' index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
